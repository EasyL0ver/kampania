<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.4 system-ui, sans-serif; background:#0f1115; color:#d7dbe0; height:100vh; display:flex; }
  #side { width:320px; flex:0 0 320px; border-right:1px solid #232733; display:flex; flex-direction:column; }
  #side h1 { font-size:14px; margin:12px 14px 4px; }
  #stats { margin:0 14px 8px; color:#8b93a1; font-size:11px; }

  .row { padding:5px 8px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .row:hover { background:#1a1e27; }
  .row.on { background:#243044; }
  .row .n { color:#5b6472; font-variant-numeric:tabular-nums; }
  .row.orphan .lbl { color:#8b6f4a; }
  .row.scene .lbl { color:#b08bd8; }
  #main { flex:1; position:relative; }
  svg { width:100%; height:100%; display:block; }
  #hint { position:absolute; top:10px; left:12px; color:#6b7280; font-size:11px; pointer-events:none; }
  #reset { position:absolute; top:8px; right:12px; padding:5px 10px; background:#1a1e27; border:1px solid #2a2f3c; color:#a7b0bd; border-radius:6px; cursor:pointer; }
  .link { fill:none; stroke:#5b6472; }
  .link.soft { stroke-dasharray:4 4; opacity:.8; }
  .link.opp  { stroke-dasharray:1.5 3.5; opacity:.85; }
  .link.synth { stroke-dasharray:9 3; opacity:.9; }

  .node circle, .node rect, .node polygon { stroke:#0f1115; stroke-width:1.5; }
  .node text { fill:#c2c8d2; font-size:10px; pointer-events:none; }
  .node.dim { opacity:.07; }
  .link.dim { opacity:.04; }
  .elabel.dim { opacity:.04; }
  .elabel { fill:#9aa3b0; font-size:9px; pointer-events:none; }
  .node text.mv { fill:#aeb6c2; font-size:8px; pointer-events:none; }
  .legend { position:absolute; bottom:10px; left:12px; right:12px; font-size:11px; color:#8b93a1; background:rgba(15,17,21,.72); padding:4px 6px; border-radius:6px; }
  .legend span { display:inline-block; margin-right:12px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
  .swl { display:inline-block; width:14px; height:0; border-top:2px solid; vertical-align:middle; margin-right:4px; }
  #tip { position:absolute; pointer-events:none; background:#181c24; border:1px solid #2a2f3c; padding:6px 8px; border-radius:6px; max-width:300px; font-size:11px; display:none; z-index:5; }
  #tip b { color:#e6eaf0; } #tip .g { color:#8b93a1; }

<script>
const DATA = {"nodes": [{"id": "clue:siblings-are-lemko", "label": "siblings-are-lemko", "kind": "clue", "desc": "[@name](../characters/wojewoda.md), [@name](../characters/matrona.md), [@name](../characters/wujas.md), and [@name](../characters/ciotka.md) are siblings of Lemko descent, hiding behind Polish identities.", "location": ""}, {"id": "clue:three-barred-cross-is-lemko", "label": "three-barred-cross-is-lemko", "kind": "clue", "desc": "The three-barred cross is a Greek Catholic symbol — Lemko, not Roman Catholic. Seeing one on a headstone, icon, or object means the owner was Lemko.", "location": ""}, {"id": "clue:three-barred-cross-on-gajda-grave", "label": "three-barred-cross-on-gajda-grave", "kind": "clue", "desc": "The well-tended double grave of [@name](../characters/wojewoda.md)'s parents, under its Polonised surname, carries a small three-barred cross half-hidden beneath the lichen.", "location": ""}, {"id": "clue:three-barred-cross-in-babcias-room", "label": "three-barred-cross-in-babcias-room", "kind": "clue", "desc": "In [@name](../characters/barbara.md)'s house, a small three-barred crucifix hangs above [@name](../characters/babcia.md)'s corner, unlike the Roman cross on the wall.", "location": ""}, {"id": "clue:three-barred-cross-in-hags-cabin", "label": "three-barred-cross-in-hags-cabin", "kind": "clue", "desc": "A small three-barred crucifix hangs among the icons in [@name](../characters/hag.md)'s cabin.", "location": ""}, {"id": "clue:hag-is-lemko", "label": "hag-is-lemko", "kind": "clue", "desc": "[@name](../characters/hag.md) is a Lemko woman living alone in the [@name](../locations/hags-cabin.md). She is ~40, not old — the forest aged her.", "location": ""}, {"id": "clue:babcia-is-lemko", "label": "babcia-is-lemko", "kind": "clue", "desc": "[@name](../characters/babcia.md), [@name](../characters/barbara.md)'s mother, is a Lemko woman who kept the old Greek Catholic faith and death customs.", "location": ""}, {"id": "clue:babcia-opposed-to-church", "label": "babcia-opposed-to-church", "kind": "clue", "desc": "[@name](../characters/babcia.md) is hostile to the Roman Catholic church. She rejects [@name](../characters/priest.md)'s faith and rites as foreign and will not have them near her family.", "location": ""}, {"id": "clue:old-village-was-lemko", "label": "old-village-was-lemko", "kind": "clue", "desc": "[@name](../locations/old-village-ruins.md) was a Lemko settlement — Greek Catholic, with a cerkiew, orchards, and a tightly-knit community.", "location": ""}, {"id": "clue:old-village-resettled-during-vistula", "label": "old-village-resettled-during-vistula", "kind": "clue", "desc": "On paper, [@name](../locations/old-village-ruins.md) was emptied in 1947 under Akcja Wisła (Operation Vistula), the forced resettlement that uprooted the Lemko and Ukrainian population of these mountains and scattered them to the north and west. The official record shows the village cleared and its people deported.", "location": ""}, {"id": "clue:old-village-is-haunted", "label": "old-village-is-haunted", "kind": "clue", "desc": "Villagers believe [@name](../locations/old-village-ruins.md) is haunted. They avoid the ruins, keep away after dark, and will not speak easily of the place.", "location": ""}, {"id": "clue:abandoned-house-by-streambed", "label": "abandoned-house-by-streambed", "kind": "clue", "desc": "There is an abandoned shepherd's hut (koliba) hidden in the gorse on the far ridge above the streambed, half-swallowed and easy to miss. Long empty.", "location": ""}, {"id": "clue:streambed-painting-is-old", "label": "streambed-painting-is-old", "kind": "clue", "desc": "[@name](../characters/painter.md)'s streambed painting is an old one. The far-ridge streambed probably does not look the way he painted it any more.", "location": ""}, {"id": "clue:streambed-painting-is-fauvist", "label": "streambed-painting-is-fauvist", "kind": "clue", "desc": "[@name](../characters/painter.md)'s streambed painting is Fauvist: the water and the land are rendered in bold, unnatural, expressive colour rather than as they really looked.", "location": ""}, {"id": "clue:painted-building-is-decaying", "label": "painted-building-is-decaying", "kind": "clue", "desc": "The cerkiew in [@name](../characters/painter.md)'s Informel painting is falling down: sagging timbers, a broken roofline, a structure well into collapse.", "location": ""}, {"id": "clue:painted-building-is-informel", "label": "painted-building-is-informel", "kind": "clue", "desc": "[@name](../characters/painter.md)'s cerkiew painting is Art Informel: the building dissolved into abstract fields of black, encrusted, scraped matter rather than drawn as it looked.", "location": ""}, {"id": "clue:unfinished-painting-is-informel", "label": "unfinished-painting-is-informel", "kind": "clue", "desc": "The unfinished canvas on [@name](../characters/painter.md)'s easel, the one he is working on now, is Art Informel: abstract fields of black, encrusted, scraped matter, no subject drawn plainly.", "location": ""}, {"id": "clue:three-barred-cross-in-abandoned-house", "label": "three-barred-cross-in-abandoned-house", "kind": "clue", "desc": "The timber inside the abandoned koliba on the far ridge is cut all over with three-barred crosses, carved deep and many times over.", "location": ""}, {"id": "clue:three-barred-cross-in-cerkiew", "label": "three-barred-cross-in-cerkiew", "kind": "clue", "desc": "The abandoned cerkiew's altar screen, icons, and carvings are marked all over with the three-barred cross.", "location": ""}, {"id": "clue:army-massacred-civilians-in-1947", "label": "army-massacred-civilians-in-1947", "kind": "clue", "desc": "In 1947, the Lemko villagers of [@name](../locations/old-village-ruins.md) were killed — the whole village, in a single act of violence. They did not \"evacuate.\" They were massacred.", "location": ""}, {"id": "clue:massacre-was-retribution", "label": "massacre-was-retribution", "kind": "clue", "desc": "The killing was not ordered or planned. Soldiers came to deport the villagers; the villagers resisted; the commanding officer was shot dead; and the enraged soldiers massacred the entire village in retribution.", "location": ""}, {"id": "clue:massacre-was-covered-up", "label": "massacre-was-covered-up", "kind": "clue", "desc": "The massacre was never reported. The soldiers covered it up to hide their failure — a dead captain and an unauthorized massacre meant courts-martial. The village was filed as \"evacuated successfully.\"", "location": ""}, {"id": "clue:officer-killed", "label": "officer-killed", "kind": "clue", "desc": "A KBW officer — [@name](../characters/kbw-officer.md) — commanded the unit at [@name](../locations/old-village-ruins.md). He was shot dead during the operation. Official records list him as KIA in a separate UPA engagement. The truth was buried with him.", "location": ""}, {"id": "clue:soldier-was-kbw", "label": "soldier-was-kbw", "kind": "clue", "desc": "[@name](../characters/soldier.md) was a soldier — he served in the KBW (Korpus Bezpieczeństwa Wewnętrznego), the internal security troops.", "location": ""}, {"id": "clue:soldier-served-in-akcja-wisla", "label": "soldier-served-in-akcja-wisla", "kind": "clue", "desc": "[@name](../characters/soldier.md) served in Akcja Wisła, the 1947 operation that forcibly deported the Lemko population from these mountains to the west.", "location": ""}, {"id": "clue:soldier-participated-in-massacre", "label": "soldier-participated-in-massacre", "kind": "clue", "desc": "[@name](../characters/soldier.md) was one of the soldiers present during the 1947 massacre. He participated in the killings.", "location": ""}, {"id": "clue:butcher-participated-in-massacre", "label": "butcher-participated-in-massacre", "kind": "clue", "desc": "[@name](../characters/butcher.md) was one of the soldiers present during the 1947 massacre. He participated in the killings.", "location": ""}, {"id": "clue:soldier-took-best-land", "label": "soldier-took-best-land", "kind": "clue", "desc": "[@name](../characters/soldier.md) settled in [@name](../locations/new-village/new-village.md) early because he knew the terrain from service. He claimed the best plot of land — profiting from the destruction.", "location": ""}, {"id": "clue:old-village-was-burned", "label": "old-village-was-burned", "kind": "clue", "desc": "[@name](../locations/old-village-ruins.md) was burned after the massacre. Wooden buildings destroyed, but stone survived — the cerkiew, foundations, the well.", "location": ""}, {"id": "clue:massacre-bodies-in-well", "label": "massacre-bodies-in-well", "kind": "clue", "desc": "The remains of the 1947 massacre victims are in [the well](../story-facts/the-well.md). They were never properly buried.", "location": ""}, {"id": "clue:dead-never-mourned", "label": "dead-never-mourned", "kind": "clue", "desc": "The 1947 dead were never given proper rites — no panakhyda, no memorial, no mourning. Twenty years of spiritual debt.", "location": ""}, {"id": "clue:paraskewia-named-the-dead", "label": "paraskewia-named-the-dead", "kind": "clue", "desc": "[@name](../characters/hag.md) has kept the names of the 1947 dead — twelve Lemko villagers plus [@name](../characters/dmytro-kosach.md) — written in Cyrillic in her own hand, and speaks them in her rites. It is the only record they ever existed. See [@name](../items/paraskewias-list.md).", "location": ""}, {"id": "clue:dam-covers-evidence", "label": "dam-covers-evidence", "kind": "clue", "desc": "The flood zone was chosen partly to bury the massacre evidence. [@name](../characters/officer.md) knows this. The dam is infrastructure *and* a burial.", "location": ""}, {"id": "clue:hag-caused-the-massacre", "label": "hag-caused-the-massacre", "kind": "clue", "desc": "[@name](../characters/hag.md) was in love with [@name](../characters/dmytro-kosach.md), a UPA soldier, in 1947. The authorities traced the connection back to the village. [@first-name](../characters/dmytro-kosach.md) killed the commanding officer. The massacre happened because of her love — twice over.", "location": ""}, {"id": "clue:barnas-family-disappeared", "label": "barnas-family-disappeared", "kind": "clue", "desc": "[@name](../characters/soldier.md)'s entire family — him, his partner, and teenage [@name](../characters/jagna.md) — vanished from [@name](../locations/new-village/new-village.md) overnight in 1954. No goodbyes, no forwarding address. Nobody asked questions. Only [@name](../characters/glupek.md) remained.", "location": ""}, {"id": "clue:barnas-family-left-edek-behind", "label": "barnas-family-left-edek-behind", "kind": "clue", "desc": "When the Barnaś family vanished, they left [@name](../characters/glupek.md) behind. The small boy stayed in the village and was taken in by [@name](../characters/ciotka.md) next door.", "location": ""}, {"id": "clue:edeks-father-left", "label": "edeks-father-left", "kind": "clue", "desc": "[@name](../characters/ciotka.md) lists herself as mother and [@name](../characters/soldier.md) as the father — left the village. Abandoned his family. The house stayed with her, the boy stayed with her. Consistent with what the rest of the village says.", "location": ""}, {"id": "clue:edek-box-key-fits-house", "label": "edek-box-key-fits-house", "kind": "clue", "desc": "The old key from the \"EDEK\" box turns the lock of [@name](../characters/ciotka.md)'s front door. It was cut for this house.", "location": ""}, {"id": "clue:ciotka-changed-the-lock", "label": "ciotka-changed-the-lock", "kind": "clue", "desc": "The front door of [@name](../characters/ciotka.md)'s house carries two locks fitted years apart — an older original and a newer one added later. At some point she changed the lock on the house.", "location": ""}, {"id": "clue:ciotka-never-married", "label": "ciotka-never-married", "kind": "clue", "desc": "In the census the boy and his absent father are recorded as Barnaś, while [@name](../characters/ciotka.md), who raises him, is Gajda. She never took his name — read straight, the two were together but never married.", "location": ""}, {"id": "clue:ciotka-and-soldier-were-not-together", "label": "ciotka-and-soldier-were-not-together", "kind": "clue", "desc": "[@name](../characters/ciotka.md) and [@name](../characters/soldier.md) were never together. They were not a couple, and [@first-name](../characters/glupek.md) is not her son. The village's \"they were together\" story is false.", "location": ""}, {"id": "clue:box-belongs-to-glupek", "label": "box-belongs-to-glupek", "kind": "clue", "desc": "The \"EDEK\" box could be [@name](../characters/glupek.md)'s — his name on the lid, a young man's kept oddments and the risqué photograph the kind a youth hides away.", "location": ""}, {"id": "clue:box-belongs-to-soldier", "label": "box-belongs-to-soldier", "kind": "clue", "desc": "The \"EDEK\" box could be [@name](../characters/soldier.md)'s, the soldier who went by [@first-name](../characters/glupek.md) too — a grown man's shaving kit, a military medal, and an old house key.", "location": ""}, {"id": "clue:house-belonged-to-edward-senior", "label": "house-belonged-to-edward-senior", "kind": "clue", "desc": "The house [@name](../characters/ciotka.md) lives in was [@name](../characters/soldier.md)'s own. His key from the \"EDEK\" box turns the front lock, and his things sat boxed in the attic. Not a stranger's home the state handed her — it was his.", "location": ""}, {"id": "clue:soldier-left-his-house-for-state", "label": "soldier-left-his-house-for-state", "kind": "clue", "desc": "On the paperwork, [@name](../characters/soldier.md) signed his house and land over to the state when the family left the village.", "location": ""}, {"id": "clue:glupek-forbidden-from-attic", "label": "glupek-forbidden-from-attic", "kind": "clue", "desc": "[@name](../characters/glupek.md)'s toys are kept up in the attic, and he is not allowed to go up for them himself. [@first-name](../characters/ciotka.md) climbs up and brings them down for him.", "location": ""}, {"id": "clue:roof-built-for-a-dome", "label": "roof-built-for-a-dome", "kind": "clue", "desc": "The attic roof is put together from the wrong pieces — shingles and timber shaped and curved to cover a dome, reused flat on this house. To a builder's eye they were made for something round, not this roof.", "location": ""}, {"id": "clue:icons-in-attic-not-catholic", "label": "icons-in-attic-not-catholic", "kind": "clue", "desc": "Icons are stored up in the attic, and to a devout eye they are plainly Eastern-rite, not Roman Catholic. They do not belong in a Catholic home.", "location": ""}, {"id": "clue:barnas-had-a-daughter-hania", "label": "barnas-had-a-daughter-hania", "kind": "clue", "desc": "[@name](../characters/soldier.md) had a teenage daughter — [@name](../characters/jagna.md). She lived in the house. She's not in the census. She's not in the village. Nobody mentions her unless prompted.", "location": ""}, {"id": "clue:something-happened-in-54", "label": "something-happened-in-54", "kind": "clue", "desc": "Something violent happened one night in 1954. [@name](../characters/wojewoda.md) came home drunk and bloody. [@name](../characters/wujas.md) collapsed into the bottle and never came back. The [@name](../characters/soldier.md) was gone by morning.", "location": ""}, {"id": "clue:barnas-family-murdered-in-54", "label": "barnas-family-murdered-in-54", "kind": "clue", "desc": "The [@name](../characters/soldier.md) was murdered in 1954 — [@name](../characters/soldier.md) and his household destroyed the night of the lynch, not a family that quietly moved away.", "location": ""}, {"id": "clue:matrona-learned-of-affair", "label": "matrona-learned-of-affair", "kind": "clue", "desc": "[@name](../characters/matrona.md) found out about the affair between [@name](../characters/jagna.md) and [@name](../characters/painter.md) on her own, and first tried to handle it quietly — she asked [@first-name](../characters/jagna.md), privately, to give [@first-name](../characters/painter.md) up.", "location": ""}, {"id": "clue:jagna-painter-affair", "label": "jagna-painter-affair", "kind": "clue", "desc": "[@name](../characters/jagna.md) and [@name](../characters/painter.md) were lovers. Open secret in the village — everyone knew.", "location": ""}, {"id": "clue:painter-loved-jagna", "label": "painter-loved-jagna", "kind": "clue", "desc": "[@name](../characters/painter.md) was in love with [@name](../characters/jagna.md), and still carries it.", "location": ""}, {"id": "clue:jagna-knew-the-secret", "label": "jagna-knew-the-secret", "kind": "clue", "desc": "[@name](../characters/jagna.md) had discovered that the Gajda siblings were secretly Lemko — she learned it from [@name](../characters/painter.md). She never used it: no threat, no demand, no word to anyone. She simply knew. It was enough to get her killed — [@name](../characters/matrona.md) presumed the girl would someday use it and did not wait to find out.", "location": ""}, {"id": "clue:matrona-orchestrated-lynch", "label": "matrona-orchestrated-lynch", "kind": "clue", "desc": "[@name](../characters/matrona.md) orchestrated the drinking that led to the lynch. She stayed sober, aimed her brothers at [@name](../characters/jagna.md), and said \"get rid of the problem.\" She never touched anyone — every hand that night was male.", "location": ""}, {"id": "clue:wujas-participated-in-lynch", "label": "wujas-participated-in-lynch", "kind": "clue", "desc": "[@name](../characters/wujas.md) was one of the men who carried out the 1954 lynch. He attacked [@name](../characters/jagna.md) and helped beat her father [@name](../characters/soldier.md) to death.", "location": ""}, {"id": "clue:wojewoda-participated-in-lynch", "label": "wojewoda-participated-in-lynch", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) was one of the men who carried out the 1954 lynch. He attacked [@name](../characters/jagna.md) and helped beat her father [@name](../characters/soldier.md) to death.", "location": ""}, {"id": "clue:butcher-participated-in-lynch", "label": "butcher-participated-in-lynch", "kind": "clue", "desc": "[@name](../characters/butcher.md) was one of the men who carried out the 1954 lynch. He attacked [@name](../characters/jagna.md) and helped beat her father [@name](../characters/soldier.md) to death.", "location": ""}, {"id": "clue:jagna-was-attacked", "label": "jagna-was-attacked", "kind": "clue", "desc": "[@name](../characters/jagna.md) was beaten by [@name](../characters/wujas.md) and [@name](../characters/butcher.md), who tore at her clothes. Her father reached her before it went further.", "location": ""}, {"id": "clue:jagna-fled-the-lynch", "label": "jagna-fled-the-lynch", "kind": "clue", "desc": "[@name](../characters/jagna.md) broke free during the struggle at the well and ran from the village into the night. She was never seen again.", "location": ""}, {"id": "clue:neighbour-believes-jagna-dead", "label": "neighbour-believes-jagna-dead", "kind": "clue", "desc": "[@name](../characters/neighbour.md) is privately certain [@name](../characters/jagna.md) died the night she fled. Two winters later, hunting, he found human remains in the forest, decided they were hers, and buried them himself. He never confirmed it was her — a coat, some bones, no face. It could have been anyone. No one has ever proven what became of her.", "location": ""}, {"id": "clue:dudka-buried-jagna", "label": "dudka-buried-jagna", "kind": "clue", "desc": "[@name](../characters/neighbour.md) buried the ravine remains as [@name](../characters/jagna.md) — to him, the body under the cairn is her.", "location": ""}, {"id": "clue:jagna-died-escaping", "label": "jagna-died-escaping", "kind": "clue", "desc": "[@name](../characters/jagna.md) ran into the forest the night of the lynch and died there, falling to her death on the rocks; the remains [@name](../characters/neighbour.md) buried at the ravine are hers. False lead. The buried woman is far older than [@first-name](../characters/jagna.md) ever was, so it cannot be her, and nothing places [@first-name](../characters/jagna.md) among the dead.", "location": ""}, {"id": "clue:jagna-born-1935", "label": "jagna-born-1935", "kind": "clue", "desc": "[@name](../characters/jagna.md) was born in 1935.", "location": ""}, {"id": "clue:jagna-is-alive", "label": "jagna-is-alive", "kind": "clue", "desc": "[@name](../characters/jagna.md) did not die in the forest. The body [@name](../characters/neighbour.md) buried as hers is a woman far older than she ever was, so it cannot be her, and nothing else places her among the dead.", "location": ""}, {"id": "clue:operator-is-jagna", "label": "operator-is-jagna", "kind": "clue", "desc": "The calm voice at the town telephone exchange is [@name](../characters/jagna.md). She did not die in 1954; she took the operator's chair, and every long-distance call the village has ever placed has passed through her.", "location": ""}, {"id": "clue:jagna-doesnt-know-glupek-alive", "label": "jagna-doesnt-know-glupek-alive", "kind": "clue", "desc": "[@name](../characters/jagna.md) believes her little brother [@name](../characters/glupek.md) died with the rest of the family in 1954. She does not know he survived and is alive in the village.", "location": ""}, {"id": "clue:telegram-points-to-barnas-yard", "label": "telegram-points-to-barnas-yard", "kind": "clue", "desc": "A telegram relayed through the exchange, addressed to the committee and signed Barnaś, says his service papers and uniform are buried under the old garden bed behind his house. [@name](../characters/soldier.md) has been dead since 1954.", "location": ""}, {"id": "clue:dudka-buried-a-friend-at-the-ravine", "label": "dudka-buried-a-friend-at-the-ravine", "kind": "clue", "desc": "[@name](../characters/neighbour.md) tends a grave in the meadow above the ravine. He'll say only that it's an old friend who fell from the ravine, and that he buried her himself. He does not name her or explain further.", "location": ""}, {"id": "clue:ravine-remains-a-woman", "label": "ravine-remains-a-woman", "kind": "clue", "desc": "A medical examination of the remains [@name](../characters/neighbour.md) buried reads the bones as female. Whoever this was, she was a grown woman.", "location": ""}, {"id": "clue:ravine-remains-died-from-fall", "label": "ravine-remains-died-from-fall", "kind": "clue", "desc": "The fracture pattern in the remains points to a single heavy impact — a fall from a height onto hard ground. She was not beaten or stabbed; she fell.", "location": ""}, {"id": "clue:ravine-remains-around-30", "label": "ravine-remains-around-30", "kind": "clue", "desc": "Bone density and joint wear put the woman in the remains at around thirty years old, give or take a couple of years. Not a teenager.", "location": ""}, {"id": "clue:soldier-killed-defending-daughter", "label": "soldier-killed-defending-daughter", "kind": "clue", "desc": "[@name](../characters/soldier.md) came to save [@name](../characters/jagna.md) — armed with his old KBW rifle. He held the men back but never fired: they were on him before he could, tackled him, wrenched the rifle away, and beat him to death with it.", "location": ""}, {"id": "clue:wojewoda-was-hurt-that-night", "label": "wojewoda-was-hurt-that-night", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) took a bad injury the night of the 1954 lynch — in the struggle over [@name](../characters/soldier.md)'s rifle, the stock was driven into his ribs and cracked them. They never healed right. He carries the old injury under his clothes and has never explained it.", "location": ""}, {"id": "clue:ciotka-house-is-wojewodas", "label": "ciotka-house-is-wojewodas", "kind": "clue", "desc": "[@name](../characters/ciotka.md) doesn't own the house she lives in and says so plainly — it's the sołtys's, [@name](../characters/wojewoda.md) gave it to her, it's his to allocate. She has no title of her own and names her brother as the source. (On paper the same house was signed over to the [@name](../locations/new-village/pgr-farm/pgr-farm.md) — see [departure-declaration-forged](#departure-declaration-forged). Her answer and the record don't agree.)", "location": ""}, {"id": "clue:ciotka-house-is-pgrs", "label": "ciotka-house-is-pgrs", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) says [@name](../characters/ciotka.md)'s house isn't his to give — it was abandoned, left to the state, and the PGR administers it; he only allocated it to her. His account and [@first-name](../characters/ciotka.md)'s (\"it's the sołtys's\") don't agree.", "location": ""}, {"id": "clue:departure-declaration-forged", "label": "departure-declaration-forged", "kind": "clue", "desc": "The document that recorded the Barnaś family's \"departure\" and handed their house and land to the [@name](../locations/new-village/pgr-farm/pgr-farm.md) is a forgery. It carries [@name](../characters/soldier.md)'s signature — but [@first-name](../characters/soldier.md) was already dead when it was filed, weeks after the 1954 lynch. Someone forged his hand to make the family's disappearance read as a voluntary move west. The paper is what let the \"they moved away\" story stand.", "location": ""}, {"id": "clue:pgr-established-in-56", "label": "pgr-established-in-56", "kind": "clue", "desc": "The PGR state farm in [@name](../locations/new-village/new-village.md) was not established until 1956, two years after the Barnaś family supposedly departed.", "location": ""}, {"id": "clue:departure-declaration-dated-56", "label": "departure-declaration-dated-56", "kind": "clue", "desc": "[@name](../characters/soldier.md)'s departure declaration surrendering the house and land to the PGR is dated 1956, two years after the family was recorded as having left the village.", "location": ""}, {"id": "clue:barnas-letter-date-55", "label": "barnas-letter-date-55", "kind": "clue", "desc": "An unopened letter addressed to [@name](../characters/soldier.md), dated 1955, sat in the attic of his old house. He was recorded as having left the village in 1954.", "location": ""}, {"id": "clue:butcher-mentioned-in-the-letter", "label": "butcher-mentioned-in-the-letter", "kind": "clue", "desc": "The unopened 1955 letter to [@name](../characters/soldier.md) passes greetings to [@name](../characters/butcher.md) from their old service comrade, placing the butcher in the same corps circle.", "location": ""}, {"id": "clue:soldier-never-married", "label": "soldier-never-married", "kind": "clue", "desc": "[@name](../characters/soldier.md) and his partner never married — they lived together. She kept her own surname. This is why no \"Barnaś\" wife appears in any village records.", "location": ""}, {"id": "clue:barnas-disliked", "label": "barnas-disliked", "kind": "clue", "desc": "[@name](../characters/soldier.md) was widely disliked in [@name](../locations/new-village/new-village.md). People kept their distance and nobody had a good word for him.", "location": ""}, {"id": "clue:glupek-strangled", "label": "glupek-strangled", "kind": "clue", "desc": "The night of the lynch, four-year-old [@name](../characters/glupek.md) wouldn't stop crying, and it annoyed [@name](../characters/butcher.md). He took a pillow, pressed it over the boy's face to shut him up, and held it there — deliberate, unhurried. [@name](../characters/ciotka.md) tore it away. It left permanent brain damage — not congenital.", "location": ""}, {"id": "clue:lynch-body-in-well", "label": "lynch-body-in-well", "kind": "clue", "desc": "[@name](../characters/soldier.md) was killed in the 1954 lynch and his body dumped in the old well in [@name](../locations/old-village-ruins.md), the same well that already held the 1947 massacre remains. A second body from that night lies with his — a grown woman. [@name](../characters/jagna.md) fled the lynch and is not among the dead.", "location": ""}, {"id": "clue:butcher-has-soldiers-gun", "label": "butcher-has-soldiers-gun", "kind": "clue", "desc": "[@name](../characters/butcher.md) took the rifle off [@name](../characters/soldier.md)'s body that night and kept it — the KBW rifle from the night of the lynch. It's still in his house.", "location": ""}, {"id": "clue:butcher-ex-soldier", "label": "butcher-ex-soldier", "kind": "clue", "desc": "The KBW knife, the KBW rifle, and the state propaganda leaflet in [@name](../characters/butcher.md)'s house make him look like an ex-soldier who served against the partisans. False lead. [@surname](../characters/butcher.md) never served — he stripped the kit off [@name](../characters/soldier.md)'s body the night of the 1954 lynch.", "location": ""}, {"id": "clue:butcher-dumped-the-body", "label": "butcher-dumped-the-body", "kind": "clue", "desc": "It was [@name](../characters/butcher.md) who put [@name](../characters/soldier.md)'s body down the old well in [@name](../locations/old-village-ruins.md) the night of the 1954 lynch — he carried the dead man to the well and dropped him in among the 1947 remains.", "location": ""}, {"id": "clue:wujas-loved-jagna", "label": "wujas-loved-jagna", "kind": "clue", "desc": "[@name](../characters/wujas.md) was in love with [@name](../characters/jagna.md), but she chose [@name](../characters/painter.md).", "location": ""}, {"id": "clue:ciotka-saved-glupek", "label": "ciotka-saved-glupek", "kind": "clue", "desc": "[@name](../characters/ciotka.md) physically intervened to save [@name](../characters/glupek.md)'s life that night. The family has never forgiven her.", "location": ""}, {"id": "clue:priest-sure-edek-innocent", "label": "priest-sure-edek-innocent", "kind": "clue", "desc": "[@name](../characters/priest.md) is certain [@name](../characters/glupek.md) did not kill [@name](../characters/ciotka.md). The boy helps around his church and he knows him to be gentle.", "location": ""}, {"id": "clue:neighbour-heard-the-lynch", "label": "neighbour-heard-the-lynch", "kind": "clue", "desc": "[@name](../characters/neighbour.md) heard everything from next door — screaming, shouting, dogs. Possibly saw men dragging bodies toward [@name](../locations/old-village-ruins.md). Closed the curtain and never spoke.", "location": ""}, {"id": "clue:neighbour-is-rattled", "label": "neighbour-is-rattled", "kind": "clue", "desc": "[@name](../characters/neighbour.md) drinks too fast and shuts down whenever the past comes up. Something about the old days frightens him.", "location": ""}, {"id": "clue:butcher-doesnt-drink", "label": "butcher-doesnt-drink", "kind": "clue", "desc": "[@name](../characters/butcher.md) doesn't drink. His house holds no alcohol at all.", "location": ""}, {"id": "clue:butcher-used-to-drink-with-the-crew", "label": "butcher-used-to-drink-with-the-crew", "kind": "clue", "desc": "[@name](../characters/butcher.md) used to drink with [@name](../characters/wujas.md) years back. He doesn't anymore.", "location": ""}, {"id": "clue:butcher-is-dangerous", "label": "butcher-is-dangerous", "kind": "clue", "desc": "Under pressure [@name](../characters/butcher.md) doesn't rage — he goes cold. Even breathing, flat eyes, a knife already turning in his hand, three dogs moving around him like his own limbs with no command spoken. He is a controlled, capable killer, and he has plainly stood ready to kill before.", "location": ""}, {"id": "clue:butcher-heads-toward-forest", "label": "butcher-heads-toward-forest", "kind": "clue", "desc": "[@name](../characters/butcher.md) is often seen heading toward the forest, alone, always in the same direction. He's going somewhere specific.", "location": ""}, {"id": "clue:butcher-dumps-carcasses-in-well", "label": "butcher-dumps-carcasses-in-well", "kind": "clue", "desc": "[@name](../characters/butcher.md) drops animal carcasses and slaughter scraps down the well — the offcuts of his trade, fed to the well between the times he has nothing else to give it.", "location": ""}, {"id": "clue:hag-tends-the-well", "label": "hag-tends-the-well", "kind": "clue", "desc": "[@name](../characters/hag.md) has spent 20 years performing Lemko rites at the well — fire, incense, bread, honey, prayer. She is containing it through acknowledgement.", "location": ""}, {"id": "clue:hag-performs-rite", "label": "hag-performs-rite", "kind": "clue", "desc": "[@name](../characters/hag.md) performs a rite over the well: fire, incense, bread, honey, and the names of the dead sung one by one.", "location": ""}, {"id": "clue:butcher-vs-hag", "label": "butcher-vs-hag", "kind": "clue", "desc": "Someone keeps clearing debris from the well. Someone else keeps piling it back and leaving candle wax in the cerkiew. [@name](../characters/butcher.md) and [@name](../characters/hag.md) are fighting over the well without knowing each other.", "location": ""}, {"id": "clue:fresh-blood-at-well", "label": "fresh-blood-at-well", "kind": "clue", "desc": "Fresh blood on the well's stone rim. Recent — not old stains. Something was dragged to the well and put in.", "location": ""}, {"id": "clue:blood-stains-by-the-well", "label": "blood-stains-by-the-well", "kind": "clue", "desc": "Minor blood stains around the well rim.", "location": ""}, {"id": "clue:you-should-jump-inside", "label": "you-should-jump-inside", "kind": "clue", "desc": "A certainty settles in that you should climb down into the dark. It does not feel like your own thought.", "location": ""}, {"id": "clue:cigarette-butts-by-the-well", "label": "cigarette-butts-by-the-well", "kind": "clue", "desc": "Cigarette butts collect in the grass and stone cracks around the well rim, more than a single visit would leave.", "location": ""}, {"id": "clue:candles-by-the-well", "label": "candles-by-the-well", "kind": "clue", "desc": "Burnt-down candles and candle wax sit around the well, left by repeated visits.", "location": ""}, {"id": "clue:someone-tends-the-well-regularly", "label": "someone-tends-the-well-regularly", "kind": "clue", "desc": "The candles at the well are replaced between visits. Someone tends the well on a regular basis.", "location": ""}, {"id": "clue:ciotka-body-taken", "label": "ciotka-body-taken", "kind": "clue", "desc": "[@name](../characters/ciotka.md)'s body is gone. Taken from her coffin in [@name](../locations/new-village/the-church/the-church.md) during the night, while the flood kept her unburied. A wet drag trail leads out toward [@name](../locations/old-village-ruins.md). **Conditional:** Only exists if [@name](../events/rezen-takes-the-body.md).", "location": ""}, {"id": "clue:rezen-fed-ciotka-to-well", "label": "rezen-fed-ciotka-to-well", "kind": "clue", "desc": "[@name](../characters/butcher.md) took [@name](../characters/ciotka.md)'s body from the church and put it in [the well](../story-facts/the-well.md). He doesn't hide it — he frames it as practical: the flood left her unburied, the body was starting to turn, so he dealt with it. He does not understand, or say, that the well pulled him to do it. **Conditional:** Only exists if [@name](../events/rezen-takes-the-body.md).", "location": ""}, {"id": "clue:babcia-mind-returns", "label": "babcia-mind-returns", "kind": "clue", "desc": "[@name](../characters/babcia.md)'s dementia reverses as the well strengthens. Nobody notices because nobody was watching.", "location": ""}, {"id": "clue:singing-in-the-night", "label": "singing-in-the-night", "kind": "clue", "desc": "Lemko prayers for the dead are sung out in the forest at night, carried on the wind.", "location": ""}, {"id": "clue:ciotka-is-devout", "label": "ciotka-is-devout", "kind": "clue", "desc": "[@name](../characters/ciotka.md) is deeply, genuinely religious. Her rosary is worn to the string and she prays reflexively, alone, unperformed. She carries her faith like penance.", "location": ""}, {"id": "clue:ciotka-is-dead", "label": "ciotka-is-dead", "kind": "clue", "desc": "[@name](../characters/ciotka.md) is dead. Her body lies on her kitchen floor.", "location": ""}, {"id": "clue:ciotka-missed-mass", "label": "ciotka-missed-mass", "kind": "clue", "desc": "[@name](../characters/ciotka.md) was absent from the anti-flood mass. She is devout and never misses a service; her empty place is unheard of.", "location": ""}, {"id": "clue:something-happened-to-ciotka", "label": "something-happened-to-ciotka", "kind": "clue", "desc": "Something has happened to [@name](../characters/ciotka.md): a woman that devout does not miss Mass.", "location": ""}, {"id": "clue:ciotka-was-killed", "label": "ciotka-was-killed", "kind": "clue", "desc": "[@name](../characters/ciotka.md) was murdered. Someone laid hands on her, wrecked the room in a struggle, and left her dead on the floor.", "location": ""}, {"id": "clue:ciotka-committed-suicide", "label": "ciotka-committed-suicide", "kind": "clue", "desc": "[@name](../characters/ciotka.md) took her own life. Alone and cornered, she swallowed a fatal dose of her own sedative.", "location": ""}, {"id": "clue:ciotka-overdosed", "label": "ciotka-overdosed", "kind": "clue", "desc": "[@name](../characters/ciotka.md) died of an overdose of her own prescribed sedative, Luminal. What killed her was the pills, not the mark on her wrist.", "location": ""}, {"id": "clue:ciotka-hurt-before-death", "label": "ciotka-hurt-before-death", "kind": "clue", "desc": "[@name](../characters/ciotka.md) was gripped hard by a large, strong hand shortly before she died. A fresh bruise rings her wrist, made while she was still alive. The grip did not kill her, but someone laid hands on her in her last hours.", "location": ""}, {"id": "clue:ciotka-house-wrecked", "label": "ciotka-house-wrecked", "kind": "clue", "desc": "One corner of [@name](../characters/ciotka.md)'s otherwise obsessively ordered house is smashed: furniture toppled, a shelf torn down, crockery broken across the floor, and a mirror shattered in the corridor. It reads like a violent struggle.", "location": ""}, {"id": "clue:two-coffee-cups", "label": "two-coffee-cups", "kind": "clue", "desc": "Two used coffee cups sit on [@name](../characters/ciotka.md)'s table. Someone drank coffee with her shortly before she died.", "location": ""}, {"id": "clue:ciotka-had-a-visitor", "label": "ciotka-had-a-visitor", "kind": "clue", "desc": "The second coffee cup was not [@name](../characters/glupek.md)'s; he will not drink coffee. An adult from outside sat and drank with [@name](../characters/ciotka.md) shortly before she died.", "location": ""}, {"id": "clue:glupek-wont-drink-coffee", "label": "glupek-wont-drink-coffee", "kind": "clue", "desc": "[@name](../characters/glupek.md) will not drink coffee. The bitterness baffles him; offered a cup, he flinches and leaves it. In that house, coffee is [@first-name](../characters/ciotka.md)'s alone.", "location": ""}, {"id": "clue:glupek-fled-into-forest", "label": "glupek-fled-into-forest", "kind": "clue", "desc": "Large bare footprints lead from [@name](../characters/ciotka.md)'s house toward the treeline and vanish where the canopy begins. [@name](../characters/glupek.md) fled into the forest the night she died.", "location": ""}, {"id": "clue:edek-ran-to-upa-bunker", "label": "edek-ran-to-upa-bunker", "kind": "clue", "desc": "[@name](../characters/glupek.md) is holed up in the [@name](../locations/upa-bunker.md) in the forest, the hiding place he knows, since he fled the night [@name](../characters/ciotka.md) died.", "location": ""}, {"id": "clue:edeks-bayonet-is-german", "label": "edeks-bayonet-is-german", "kind": "clue", "desc": "The bayonet hidden among [@name](../characters/glupek.md)'s things is a German wartime army blade, not Polish issue. It cannot have come from his father [@name](../characters/soldier.md)'s KBW kit.", "location": ""}, {"id": "clue:trident-on-the-bayonet", "label": "trident-on-the-bayonet", "kind": "clue", "desc": "A trident is carved by hand into the flat of the [@name](../items/bayonet.md)'s blade, three prongs rising from a base.", "location": ""}, {"id": "clue:upa-used-german-equipment", "label": "upa-used-german-equipment", "kind": "clue", "desc": "The UPA armed itself largely with captured weapons, much of it German wartime equipment left from the occupation.", "location": ""}, {"id": "clue:trident-stands-for-upa", "label": "trident-stands-for-upa", "kind": "clue", "desc": "The trident, the tryzub, is the Ukrainian national emblem and the mark of the UPA.", "location": ""}, {"id": "clue:edek-kept-upa-equipment", "label": "edek-kept-upa-equipment", "kind": "clue", "desc": "The [@name](../items/bayonet.md) [@name](../characters/glupek.md) hid among his things is UPA kit. He kept a piece of partisan equipment.", "location": ""}, {"id": "clue:junior-pressed-ciotka", "label": "junior-pressed-ciotka", "kind": "clue", "desc": "[@name](../characters/junior.md) visited [@name](../characters/ciotka.md) the day before she died and pressed her hard about his mother [@name](../characters/wife.md)'s secret investigation into the family. He wanted her to tell the truth, not to silence her.", "location": ""}, {"id": "clue:ciotka-told-edek-the-truth", "label": "ciotka-told-edek-the-truth", "kind": "clue", "desc": "Before she died, [@name](../characters/ciotka.md) told [@name](../characters/glupek.md) the truth: the people of this village killed his father [@name](../characters/soldier.md), and [@first-name](../characters/glupek.md) is the living proof. The reveal broke him.", "location": ""}, {"id": "clue:butts-at-ciotkas-are-carmen", "label": "butts-at-ciotkas-are-carmen", "kind": "clue", "desc": "The cigarette butts from [@name](../characters/ciotka.md)'s door are Carmen, a premium brand rarely seen this far out.", "location": ""}, {"id": "clue:junior-smokes-carmen", "label": "junior-smokes-carmen", "kind": "clue", "desc": "[@name](../characters/junior.md) smokes Carmen, a premium brand.", "location": ""}, {"id": "clue:butcher-smokes-carmen", "label": "butcher-smokes-carmen", "kind": "clue", "desc": "[@name](../characters/butcher.md) smokes Carmen, a premium brand.", "location": ""}, {"id": "clue:edek-has-carmen-cigarette", "label": "edek-has-carmen-cigarette", "kind": "clue", "desc": "An unsmoked Carmen cigarette is hidden in [@name](../characters/glupek.md)'s corner. [@first-name](../characters/glupek.md) does not smoke.", "location": ""}, {"id": "clue:rezen-gave-edek-cigarette", "label": "rezen-gave-edek-cigarette", "kind": "clue", "desc": "[@name](../characters/butcher.md) gave [@name](../characters/glupek.md) the Carmen cigarette. [@surname](../characters/butcher.md) is fond of the boy and slips him food and small gifts.", "location": ""}, {"id": "clue:tadek-smokes-cheapest", "label": "tadek-smokes-cheapest", "kind": "clue", "desc": "[@name](../characters/wujas.md) smokes Sport, the cheapest brand. He does not smoke Carmen.", "location": ""}, {"id": "clue:door-and-well-butts-match", "label": "door-and-well-butts-match", "kind": "clue", "desc": "The Carmen butts from [@name](../characters/ciotka.md)'s door and the Carmen butts from [@name](../locations/old-village-ruins.md) are the same brand.", "location": ""}, {"id": "clue:priest-smokes", "label": "priest-smokes", "kind": "clue", "desc": "[@name](../characters/priest.md) secretly smokes. He hides the habit.", "location": ""}, {"id": "clue:priest-smokes-carmen", "label": "priest-smokes-carmen", "kind": "clue", "desc": "[@name](../characters/priest.md) secretly smokes Carmen, the same premium brand as Junior and [@surname](../characters/butcher.md). He hides the habit.", "location": ""}, {"id": "clue:junior-lingered-at-ciotkas-house", "label": "junior-lingered-at-ciotkas-house", "kind": "clue", "desc": "The Carmen butts at [@name](../characters/ciotka.md)'s door match [@name](../characters/junior.md)'s brand. He was at her house shortly before she died.", "location": ""}, {"id": "clue:rezen-lingered-at-ciotkas-house", "label": "rezen-lingered-at-ciotkas-house", "kind": "clue", "desc": "The Carmen butts at [@name](../characters/ciotka.md)'s door match [@name](../characters/butcher.md)'s brand. He was at her house shortly before she died.", "location": ""}, {"id": "clue:priest-lingered-at-ciotkas-house", "label": "priest-lingered-at-ciotkas-house", "kind": "clue", "desc": "The Carmen butts at [@name](../characters/ciotka.md)'s door match [@name](../characters/priest.md)'s brand. He was at her house shortly before she died.", "location": ""}, {"id": "clue:glupek-smokes", "label": "glupek-smokes", "kind": "clue", "desc": "A Carmen cigarette hides in [@name](../characters/glupek.md)'s corner and Carmen butts litter the door: it looks like [@first-name](../characters/glupek.md) is the smoker. False lead. The butts were [@name](../characters/junior.md)'s and the cigarette was a gift; [@first-name](../characters/glupek.md) does not smoke.", "location": ""}, {"id": "clue:covered-mirrors", "label": "covered-mirrors", "kind": "clue", "desc": "[@name](../characters/babcia.md) covers every mirror in [@name](../characters/barbara.md)'s house. In [Lemko tradition](../historical%20context/13-lemko-beliefs-and-folk-magic.md), mirrors are covered when someone dies. She's been doing it for twenty years.", "location": ""}, {"id": "clue:barbara-has-help", "label": "barbara-has-help", "kind": "clue", "desc": "Someone is helping [@name](../characters/barbara.md). The house, the firewood, the economics — a single farm labourer with a child and an elderly mother can't sustain this alone.", "location": ""}, {"id": "clue:barbara-refuses-father", "label": "barbara-refuses-father", "kind": "clue", "desc": "[@name](../characters/barbara.md) will not name [@name](../characters/pawelek.md)'s father under any circumstances. No pressure, authority, or charm moves this. The refusal itself is the clue — she's protecting someone or something.", "location": ""}, {"id": "clue:marek-is-paweleks-father", "label": "marek-is-paweleks-father", "kind": "clue", "desc": "[@name](../characters/barbara.md) names [@name](../characters/junior.md) as [@name](../characters/pawelek.md)'s father under pressure. She believes it's true. It's not — the real father is [@name](../characters/wujas.md).", "location": ""}, {"id": "clue:wujas-slept-with-barbara", "label": "wujas-slept-with-barbara", "kind": "clue", "desc": "[@name](../characters/wujas.md) slept with [@name](../characters/barbara.md) once. Neither of them talks about it. [@first-name](../characters/barbara.md) was also with [@name](../characters/junior.md) and assumes [@first-name](../characters/junior.md) is the father. [@nickname](../characters/wujas.md) doesn't even consider the possibility. It was one night.", "location": ""}, {"id": "clue:wujas-is-paweleks-father", "label": "wujas-is-paweleks-father", "kind": "clue", "desc": "[@name](../characters/wujas.md) is [@name](../characters/pawelek.md)'s father.", "location": ""}, {"id": "clue:pawelek-wanders-to-old-village", "label": "pawelek-wanders-to-old-village", "kind": "clue", "desc": "[@name](../characters/pawelek.md) roams unsupervised as far as [@name](../locations/old-village-ruins.md) — edges, creek, tree line, further than a 4-year-old should go. Nobody watches him closely enough.", "location": ""}, {"id": "clue:wojewoda-built-barbaras-house", "label": "wojewoda-built-barbaras-house", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) built [@name](../characters/barbara.md) a house out of guilt — he suspects [@name](../characters/junior.md) fathered [@name](../characters/pawelek.md). He's wrong.", "location": ""}, {"id": "clue:wojewoda-is-a-party-member", "label": "wojewoda-is-a-party-member", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) is a PZPR (Party) member. It is how a founding sołtys was handed the PGR directorship and runs the farm with near-total autonomy.", "location": ""}, {"id": "clue:barbara-is-a-sieve", "label": "barbara-is-a-sieve", "kind": "clue", "desc": "[@name](../characters/barbara.md) shares what she hears from the committee casually with [@name](../characters/neighbour.md) over the fence. Everything the players tell her reaches the one man sitting on 13 years of guilt.", "location": ""}, {"id": "clue:wife-has-been-investigating", "label": "wife-has-been-investigating", "kind": "clue", "desc": "[@name](../characters/wife.md) has spent years quietly investigating the events of 1954. She and [@name](../characters/junior.md) work together in secret — a parallel investigation running alongside the committee's.", "location": ""}, {"id": "clue:flour-tin-evidence", "label": "flour-tin-evidence", "kind": "clue", "desc": "[@name](../characters/wife.md) keeps her evidence in a flour tin in the pantry — a stained shirt, a mismatched button, newspaper clippings, handwritten notes. Looks like a cover-up dossier. Could be building a case *against* [@name](../characters/wojewoda.md) or *for* him — players can't tell.", "location": ""}, {"id": "clue:junior-drinks-with-crew", "label": "junior-drinks-with-crew", "kind": "clue", "desc": "[@name](../characters/junior.md) drinks with [@name](../characters/wujas.md)'s crew away from his father — a rebellious kid blowing off the sołtys, not a man on cover-up business.", "location": ""}, {"id": "clue:wujas-is-guilty", "label": "wujas-is-guilty", "kind": "clue", "desc": "[@name](../characters/wujas.md) is guilty of something terrible. He's been drinking to forget for 13 years and the guilt is visibly destroying him.", "location": ""}, {"id": "clue:ciotka-lives-in-soldiers-house", "label": "ciotka-lives-in-soldiers-house", "kind": "clue", "desc": "[@name](../characters/ciotka.md) lives in [@name](../characters/soldier.md)'s former house — the best plot in the village — raising his brain-damaged son. A single woman in a dead man's house with no clean explanation.", "location": ""}, {"id": "clue:girls-dress-in-ciotkas-house", "label": "girls-dress-in-ciotkas-house", "kind": "clue", "desc": "A blue dress is kept, folded, in [@name](../characters/ciotka.md)'s house.", "location": ""}, {"id": "clue:dress-belonged-to-teenage-girl", "label": "dress-belonged-to-teenage-girl", "kind": "clue", "desc": "The blue dress was cut for a teenage girl, not a grown woman and not a child.", "location": ""}, {"id": "clue:dress-distressed-painter", "label": "dress-distressed-painter", "kind": "clue", "desc": "Shown the blue dress, [@name](../characters/painter.md) reacts with visible distress.", "location": ""}, {"id": "clue:dress-belonged-to-barnas-daughter", "label": "dress-belonged-to-barnas-daughter", "kind": "clue", "desc": "The blue dress kept in [@name](../characters/ciotka.md)'s house belonged to the Barnaś daughter.", "location": ""}, {"id": "clue:childs-rattle-in-ciotkas-house", "label": "childs-rattle-in-ciotkas-house", "kind": "clue", "desc": "A small child's rattle is kept in [@name](../characters/ciotka.md)'s house. A baby lived here once.", "location": ""}, {"id": "clue:lemko-bell-from-the-cerkiew", "label": "lemko-bell-from-the-cerkiew", "kind": "clue", "desc": "The brass bell from [@first-name](../characters/ciotka.md)'s attic is the missing fitting of the [@name](../locations/old-village.md) cerkiew.", "location": ""}, {"id": "clue:lemko-bell-in-ciotkas-house", "label": "lemko-bell-in-ciotkas-house", "kind": "clue", "desc": "A small brass Greek Catholic liturgical bell with Cyrillic lettering is hidden in [@name](../characters/ciotka.md)'s house. An Eastern-rite object, out of place in a Roman Catholic home.", "location": ""}, {"id": "clue:ciotka-moved-in-after-they-were-gone", "label": "ciotka-moved-in-after-they-were-gone", "kind": "clue", "desc": "[@name](../characters/ciotka.md) wasn't always in that house. A family lived there before — the Barnaś family. They left, and [@first-name](../characters/ciotka.md) moved in with the boy.", "location": ""}, {"id": "clue:ciotka-adopted-glupek", "label": "ciotka-adopted-glupek", "kind": "clue", "desc": "[@name](../characters/ciotka.md) took in [@name](../characters/glupek.md) after the family vanished. Nobody asked her to. Nobody stopped her.", "location": ""}, {"id": "clue:ciotka-avoids-family", "label": "ciotka-avoids-family", "kind": "clue", "desc": "[@name](../characters/ciotka.md) keeps her distance from the family. She begs off gatherings and stays anxious around her siblings — the avoidance is hers, not theirs.", "location": ""}, {"id": "clue:glupek-fears-butcher", "label": "glupek-fears-butcher", "kind": "clue", "desc": "[@name](../characters/glupek.md) flinches instinctively from [@name](../characters/butcher.md). No conscious memory — just a body that knows. When [@name](../characters/butcher.md)'s dogs bark, [@name](../characters/glupek.md) hides.", "location": ""}, {"id": "clue:wojewoda-has-only-phone", "label": "wojewoda-has-only-phone", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) has the only telephone in the village, in his office. The village's sole link to the outside world.", "location": ""}, {"id": "clue:wojewoda-has-gun", "label": "wojewoda-has-gun", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) has a pistol in his office. Locked. Symbol of authority — but loaded.", "location": ""}, {"id": "clue:neighbour-has-rifle", "label": "neighbour-has-rifle", "kind": "clue", "desc": "[@name](../characters/neighbour.md) is a hunter with a licensed hunting rifle.", "location": ""}, {"id": "clue:neighbour-is-old-settler", "label": "neighbour-is-old-settler", "kind": "clue", "desc": "[@name](../characters/neighbour.md) has farmed the plot next to the Barnaś/[@first-name](../characters/ciotka.md) house since ~1948 — an early settler, there through the 1954 lynch.", "location": ""}, {"id": "clue:siblings-fund-the-church", "label": "siblings-fund-the-church", "kind": "clue", "desc": "The siblings keep the [@name](../locations/new-village/the-church/the-church.md) unusually well supplied — firewood, food, gifts. [@name](../characters/priest.md)'s silence is materially supported.", "location": ""}, {"id": "clue:emil-doesnt-paint-people", "label": "emil-doesnt-paint-people", "kind": "clue", "desc": "[@name](../characters/painter.md) paints only landscapes. He never paints people.", "location": ""}, {"id": "clue:painter-fascinated-by-old-village", "label": "painter-fascinated-by-old-village", "kind": "clue", "desc": "Across [@name](../characters/painter.md)'s canvases the old village returns again and again: its well, its cerkiew, its ruined houses, painted with a fascination and care nothing else in his work gets. The place plainly holds something for him.", "location": ""}, {"id": "clue:painters-style-shifted-to-dark", "label": "painters-style-shifted-to-dark", "kind": "clue", "desc": "[@name](../characters/painter.md)'s canvases fall into two clearly different hands. The earlier work is Fauvist: figures and village scenes in bold, unnatural, joyful colour, alive and full of light. Everything after a break point is Art Informel: abstract fields of black encrusted paint, matter scraped and clotted like drowned ground, death and decay with no figure left in it. For a self-taught man in this village, both are startlingly modern. Something broke him between the two.", "location": ""}, {"id": "clue:emil-traumatised-in-54", "label": "emil-traumatised-in-54", "kind": "clue", "desc": "Confronted with how his work turned dark, [@name](../characters/painter.md) admits that something happened to him in 1954 that he never recovered from.", "location": ""}, {"id": "clue:portrait-painted-before-the-break", "label": "portrait-painted-before-the-break", "kind": "clue", "desc": "The hidden cerkiew portrait is painted in [@name](../characters/painter.md)'s earlier Fauvist style, from before his work collapsed into abstraction, death, and decay.", "location": ""}, {"id": "clue:portrait-hidden-in-cerkiew", "label": "portrait-hidden-in-cerkiew", "kind": "clue", "desc": "A portrait of a young dark-haired woman is hidden in the ruined cerkiew at [@name](../locations/old-village-cerkiew.md), wrapped and sheltered from the rain.", "location": ""}, {"id": "clue:portrait-woman-in-blue-dress", "label": "portrait-woman-in-blue-dress", "kind": "clue", "desc": "The woman in [@name](../characters/painter.md)'s hidden portrait wears a blue dress.", "location": ""}, {"id": "clue:portrait-is-fauvist", "label": "portrait-is-fauvist", "kind": "clue", "desc": "The hidden cerkiew portrait is painted in a Fauvist style: bold, unnatural, expressive colour, alive and full of light.", "location": ""}, {"id": "clue:portrait-dedicated-to-forget-me-not", "label": "portrait-dedicated-to-forget-me-not", "kind": "clue", "desc": "On the back of the hidden portrait is a dedication, to \"my forget-me-not.\" It was painted as a private love token, not a commission.", "location": ""}, {"id": "clue:blue-dress-matches-portrait", "label": "blue-dress-matches-portrait", "kind": "clue", "desc": "The blue dress kept in [@name](../characters/ciotka.md)'s house is the same one the woman wears in [@name](../characters/painter.md)'s hidden portrait.", "location": ""}, {"id": "clue:emil-signed-the-portrait", "label": "emil-signed-the-portrait", "kind": "clue", "desc": "The hidden portrait carries [@name](../characters/painter.md)'s signature. He painted it himself.", "location": ""}, {"id": "clue:portrait-is-jagnas", "label": "portrait-is-jagnas", "kind": "clue", "desc": "The woman in the hidden portrait is [@name](../characters/jagna.md).", "location": ""}, {"id": "clue:neighbour-avoids-ciotkas-window", "label": "neighbour-avoids-ciotkas-window", "kind": "clue", "desc": "[@name](../characters/neighbour.md)'s window facing Ciotka's house is always covered with a heavy curtain — never opened. The window facing [@first-name](../characters/barbara.md)'s house has no curtain at all.", "location": ""}, {"id": "clue:neighbour-has-insomnia", "label": "neighbour-has-insomnia", "kind": "clue", "desc": "[@name](../characters/neighbour.md) paces at night and keeps his light on at 3am. He doesn't sleep well.", "location": ""}, {"id": "clue:neighbour-knows-about-edek", "label": "neighbour-knows-about-edek", "kind": "clue", "desc": "[@name](../characters/neighbour.md) knows something about where [@first-name](../characters/glupek.md) came from. He deflects when the topic comes up — too quickly, too rehearsed.", "location": ""}, {"id": "clue:church-too-nice", "label": "church-too-nice", "kind": "clue", "desc": "The church is too well-maintained for a village this size — fresh repairs, good supplies, ample firewood. Someone is funding it beyond what the parish can afford.", "location": ""}, {"id": "clue:wujas-misses-someone", "label": "wujas-misses-someone", "kind": "clue", "desc": "When drunk enough, [@name](../characters/wujas.md)'s fragments turn to longing. Half-sentences about a woman, a name he won't finish, someone he lost long ago. He misses her badly.", "location": ""}, {"id": "clue:irena-is-watchful", "label": "irena-is-watchful", "kind": "clue", "desc": "[@name](../characters/wife.md) hosts with grace but something is tight behind the hospitality. She listens at doors during conversations with the sołtys — a shadow, a floorboard creak — and tracks the committee more closely than she lets on. She's aware of more than she shows.", "location": ""}, {"id": "clue:wife-protects-husband", "label": "wife-protects-husband", "kind": "clue", "desc": "[@name](../characters/wife.md) has realized [@name](../characters/wojewoda.md) took part in the 1954 killing. Rather than expose him, she has closed ranks with him. She has stopped investigating, shut the household, and will keep [@first-name](../characters/wojewoda.md) from confessing — even when he wants to.", "location": ""}, {"id": "clue:solina-dam-construction-almost-finished", "label": "solina-dam-construction-almost-finished", "kind": "clue", "desc": "The Solina dam is nearly finished. The reservoir behind it is already beginning to fill.", "location": ""}, {"id": "clue:new-village-will-be-drowned-by-solina-lake", "label": "new-village-will-be-drowned-by-solina-lake", "kind": "clue", "desc": "[@name](../locations/new-village/new-village.md) will flood. When the reservoir rises, the valley has no outlet below house level. The ridge water-gap, the PGR irrigation ditch, and the old far-ridge streambed all fail to carry the water off, so it backs up onto the houses. This is proof, not speculation.", "location": ""}, {"id": "clue:other-villages-ready-for-evacuation", "label": "other-villages-ready-for-evacuation", "kind": "clue", "desc": "Every other village in the Solina flood zone has been emptied or is packed and waiting for evacuation. [@name](../locations/new-village/new-village.md) is the only one the plan leaves standing.", "location": ""}, {"id": "clue:new-village-will-be-next-to-solina-lake", "label": "new-village-will-be-next-to-solina-lake", "kind": "clue", "desc": "When the reservoir is full, Lake Solina will stop at the edge of [@name](../locations/new-village/new-village.md): a lakeside village, above the waterline. [@name](../locations/new-village/new-village.md) is safe. The PGR irrigation ditch carries the flood clear of the valley, so the water drains away and never reaches the houses. One working outlet is all the valley needs, and here is one. This is the reassuring answer, and it is false: it rests entirely on the ditch's concrete head, which calculates as ample only because no one measured the earth dugout that runs the rest of its length. The gap and the streambed are never even tested. It contradicts new-village-will-be-drowned-by-solina-lake.", "location": ""}, {"id": "clue:gap-is-candidate-drain", "label": "gap-is-candidate-drain", "kind": "clue", "desc": "The ridge water-gap, the notch the map shows draining into the empty [@name](../locations/big-basin.md), is one of the candidate outlets floodwater could leave the [@name](../locations/new-village/new-village.md) valley through.", "location": ""}, {"id": "clue:ditch-is-candidate-drain", "label": "ditch-is-candidate-drain", "kind": "clue", "desc": "The PGR irrigation ditch is one of the candidate outlets floodwater could leave the [@name](../locations/new-village/new-village.md) valley through.", "location": ""}, {"id": "clue:streambed-is-candidate-drain", "label": "streambed-is-candidate-drain", "kind": "clue", "desc": "The old far-ridge streambed is one of the candidate outlets floodwater could leave the [@name](../locations/new-village/new-village.md) valley through.", "location": ""}, {"id": "clue:the-flood-line-potentially-miscalculated", "label": "the-flood-line-potentially-miscalculated", "kind": "clue", "desc": "[@title](../characters/professor.md) [@surname](../characters/professor.md) suspects the official flood line for the [@name](../locations/new-village/new-village.md) valley may be miscalculated. The projected safe level rests on two assumptions: that the ground stands where the map records it, and that the valley drains through its outlets as the survey assumes. If the mapped heights are wrong, or the outlets do not carry the water off, the safe level is wrong and the new village may not sit above it after all. Both assumptions have to be checked on the ground.", "location": ""}, {"id": "clue:gap-is-blocked", "label": "gap-is-blocked", "kind": "clue", "desc": "A ridge separates the [@name](../locations/new-village/new-village.md) valley from the empty [@name](../locations/big-basin.md) beyond it. The state map shows a water-gap through that ridge as an open drain into [@name](../locations/big-basin.md), the outlet the whole safety calculation rests on. An old landslide has plugged it: the crest of the plug stands above the flood line, and the fill is impermeable, so rising water can neither crest the plug nor seep through it into [@name](../locations/big-basin.md). It is one of the three outlets the valley needs, and it is sealed.", "location": ""}, {"id": "clue:ditch-drains-nothing", "label": "ditch-drains-nothing", "kind": "clue", "desc": "The PGR irrigation ditch cannot carry the floodwater off. At flood volume it backs up and overflows; it is far too small to drain the valley.", "location": ""}, {"id": "clue:ditch-drains-fine", "label": "ditch-drains-fine", "kind": "clue", "desc": "Run against the drainage tables, the irrigation ditch's concrete head is a channel of ample capacity: on those figures it carries the flood clear of the fields. This is the report's all-clear, and it is false. The sum measures only the short concrete stretch, not the earth dugout that makes up most of the ditch. Only someone who has walked the full length has cause to doubt it.", "location": ""}, {"id": "clue:foreman-uneasy-about-ditch", "label": "foreman-uneasy-about-ditch", "kind": "clue", "desc": "[@first-name](../characters/foreman.md) is uneasy when he vouches for the irrigation ditch.", "location": ""}, {"id": "clue:ditch-not-built-to-spec", "label": "ditch-not-built-to-spec", "kind": "clue", "desc": "The irrigation ditch matches its concrete-lined specification only for its first short stretch near the fields. Past that it degrades to a shallow, unlined dugout for most of its length. Inspecting only the head gives a false impression of a sound channel.", "location": ""}, {"id": "clue:ditch-concrete-stops-short", "label": "ditch-concrete-stops-short", "kind": "clue", "desc": "The irrigation ditch is concrete-lined only near the head. A short way down the concrete ends and the channel becomes a plain earth dugout. Whether that is a fault, a shortfall against spec, or simply how it was meant to be built is not clear from walking it.", "location": ""}, {"id": "clue:streambed-dead-ends", "label": "streambed-dead-ends", "kind": "clue", "desc": "The old streambed on the far ridge is not an outlet. Its col sits above house level, so the rising water tops [@name](../locations/new-village/new-village.md) before it ever reaches that streambed.", "location": ""}, {"id": "clue:dam-builders-surveyed-streambed", "label": "dam-builders-surveyed-streambed", "kind": "clue", "desc": "The Solina dam-survey crews already worked the far-ridge streambed years ago and set geodetic benchmarks (reper) at the col and by the village. The markers are out there in the field, though their recorded elevations never made it into the kit's papers.", "location": ""}, {"id": "clue:streambed-never-drained", "label": "streambed-never-drained", "kind": "clue", "desc": "The old far-ridge streambed has never carried water off, even in the worst floods within living memory. Water pools against the rock there and stops.", "location": ""}, {"id": "clue:landslide-in-the-gap", "label": "landslide-in-the-gap", "kind": "clue", "desc": "A landslide sits in the ridge water-gap, filling the notch with fallen rock and earth.", "location": ""}, {"id": "clue:gap-may-seep", "label": "gap-may-seep", "kind": "clue", "desc": "From the foot of the plug the landslide fill looks like loose, open rubble, the kind of stone floodwater would run straight through. On that first look the gap might still drain by seeping through the fill. Whether it truly does is unsettled until the fill is examined up close.", "location": ""}, {"id": "clue:water-may-flow-over", "label": "water-may-flow-over", "kind": "clue", "desc": "For the ridge gap to drain the valley, rising water would have to reach the plug's lowest saddle and spill over it into [@name](../locations/big-basin.md). If that saddle sits below the [@name](../locations/new-village/new-village.md) flood line, the gap still drains by overtopping. Whether it is low enough is unsettled until the crest is measured.", "location": ""}, {"id": "clue:river-doesnt-match-map", "label": "river-doesnt-match-map", "kind": "clue", "desc": "The river no longer runs where the map draws it. Its course has shifted: the wojewoda's bridge spans the river's new bed, while the map shows that ground dry and the river running elsewhere. The old course drawn on the map is now dry.", "location": ""}, {"id": "clue:bridge-over-solid-land", "label": "bridge-over-solid-land", "kind": "clue", "desc": "On the state map, a bridge is drawn spanning dry ground while the river is drawn running elsewhere. The map contradicts itself.", "location": ""}, {"id": "clue:map-shows-gap-open", "label": "map-shows-gap-open", "kind": "clue", "desc": "The state map draws the ridge water-gap as an open channel, an outlet for the valley's water.", "location": ""}, {"id": "clue:map-is-outdated", "label": "map-is-outdated", "kind": "clue", "desc": "The state map predates the landslide that plugged the gap. It cannot be trusted on the gap or on the river's course.", "location": ""}, {"id": "clue:village-terrain-matches-map", "label": "village-terrain-matches-map", "kind": "clue", "desc": "The surveyed elevations of the [@name](../locations/new-village/new-village.md) valley match the state map's contours. The ground reads true against the paper, so the map is an accurate record of the terrain everywhere the players check it. The only places it disagrees with reality are the plugged gap and the shifted river.", "location": ""}, {"id": "clue:survey-was-botched", "label": "survey-was-botched", "kind": "clue", "desc": "The crew sent to re-check the terrain never properly did the work. They drove a few stakes, drank through the visit, took the wojewoda's ditch on faith, dismissed the changed river, and filed thin paper. Not a deliberate forgery, just a half-assed, negligent job, but it means the official survey behind the flood projection cannot be trusted.", "location": ""}, {"id": "clue:survey-was-faked", "label": "survey-was-faked", "kind": "clue", "desc": "The thin survey was not merely lazy work but deliberately falsified: someone knew the ground was never properly checked and signed it off as sound anyway. The official all-clear was manufactured, not just botched.", "location": ""}, {"id": "clue:geologists-were-drinking", "label": "geologists-were-drinking", "kind": "clue", "desc": "The last state survey crew sent to re-check the terrain drank through their whole visit, at [@nickname](../characters/wujas.md)'s still and by the road, driving only a few stakes before they left. Testimony from men who watched them, not proof on its own that the survey is worthless.", "location": ""}, {"id": "clue:original-report-is-thin", "label": "original-report-is-thin", "kind": "clue", "desc": "The previous crew's filed survey report is thin: too few field stations, cursory coverage, the ditch taken on faith from its concrete head, the changed river dismissed. On the paper alone it does not add up to a real survey, though thin work is not yet proof the whole job was botched.", "location": ""}, {"id": "clue:surveyors-are-known-drunks", "label": "surveyors-are-known-drunks", "kind": "clue", "desc": "The PGR crew rib survey men as famous drunks, and the last survey team who came drank through their whole visit instead of working the ground.", "location": ""}, {"id": "clue:flood-mark-left-by-dam-builders", "label": "flood-mark-left-by-dam-builders", "kind": "clue", "desc": "The flood line staked across the [@name](../locations/new-village/new-village.md) valley was set by the Solina dam-survey crews, not the resettlement survey. It marks the reservoir's projected fill level, tied to the dam builders' own benchmarks, and stands at 420.0 m above sea level.", "location": ""}, {"id": "clue:lower-village-level", "label": "lower-village-level", "kind": "clue", "desc": "The surveyed elevation of the lower part of [@name](../locations/new-village/new-village.md): 420.8 m above sea level.", "location": ""}, {"id": "clue:upper-village-level", "label": "upper-village-level", "kind": "clue", "desc": "The surveyed elevation of the upper part of [@name](../locations/new-village/new-village.md): 422.0 m above sea level.", "location": ""}, {"id": "clue:southern-rise-level", "label": "southern-rise-level", "kind": "clue", "desc": "The surveyed elevation of the rise south of [@name](../locations/new-village/new-village.md): 423.0 m above sea level.", "location": ""}, {"id": "clue:old-village-bowl-level", "label": "old-village-bowl-level", "kind": "clue", "desc": "The surveyed elevation of the floor of the old-village bowl: 408.0 m above sea level.", "location": ""}, {"id": "clue:big-basin-floor-level", "label": "big-basin-floor-level", "kind": "clue", "desc": "The surveyed elevation of the floor of [@name](../locations/big-basin.md): 405.0 m above sea level.", "location": ""}, {"id": "clue:gap-foot-level", "label": "gap-foot-level", "kind": "clue", "desc": "The surveyed elevation of the ground at the foot of the ridge plug, just below the gap climb: 418.0 m above sea level. It is the low approach where the valley's water would gather to leave through the gap, below house level but sealed off by the plug rising above it.", "location": ""}, {"id": "clue:wojewoda-already-suspects-flooding", "label": "wojewoda-already-suspects-flooding", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) already suspects the flood is coming before the committee arrives. He sees it as an opportunity — water swallows the evidence.", "location": ""}, {"id": "clue:road-washes-out", "label": "road-washes-out", "kind": "clue", "desc": "Day 2 brings a major flood. The road out disappears. The committee is stranded. No outside backup.", "location": ""}, {"id": "clue:old-village-flooding", "label": "old-village-flooding", "kind": "clue", "desc": "The old village site is flooding — water rising from below, the well filling. Something underground is changing.", "location": ""}, {"id": "clue:flood-is-imminent", "label": "flood-is-imminent", "kind": "clue", "desc": "The flood is not a future worry but an immediate one. The water is rising fast and [@name](../locations/new-village/new-village.md) will be inundated within days.", "location": ""}, {"id": "clue:officer-warning", "label": "officer-warning", "kind": "clue", "desc": "[@name](../characters/officer.md) advises the committee to stick to the living villagers and leave old matters alone.", "location": ""}, {"id": "clue:government-committee", "label": "government-committee", "kind": "clue", "desc": "The player characters volunteered as representatives of the public, independent observers on a state committee sent to [@name](../locations/new-village/new-village.md) ahead of the reservoir. It is the frame the whole visit hangs on: the reason outsiders can measure land, enter homes, and ask questions at all.", "location": ""}, {"id": "clue:committee-runs-geographical-survey", "label": "committee-runs-geographical-survey", "kind": "clue", "desc": "The committee's stated purpose in the village is a geographical survey — terrain, river, boundaries. It's the cover that explains why outsiders are measuring the land.", "location": ""}, {"id": "clue:committee-notes-property-for-damage", "label": "committee-notes-property-for-damage", "kind": "clue", "desc": "The committee is recording each household's property and its value, ostensibly to assess damages. Asking what land is worth is part of the official remit.", "location": ""}, {"id": "clue:village-unaware-of-miscalculation", "label": "village-unaware-of-miscalculation", "kind": "clue", "desc": "The villagers of [@name](../locations/new-village/new-village.md) have not been told the flood line may be miscalculated. The committee is not to tell them.", "location": ""}, {"id": "clue:committee-fills-census", "label": "committee-fills-census", "kind": "clue", "desc": "The committee is taking a census: who lives in each household, names, ages, how long they have been here. Counting heads is part of the official remit.", "location": ""}, {"id": "clue:committee-accounts-movable-state-property", "label": "committee-accounts-movable-state-property", "kind": "clue", "desc": "The committee's remit also covers the state farm's movable property. The [@name](../locations/new-village/pgr-farm/pgr-farm.md)'s livestock, machinery, and grain stores are socialist property that cannot be left to drown, so they must be inventoried and moved out before the flood. The buildings and fixed works are written of
