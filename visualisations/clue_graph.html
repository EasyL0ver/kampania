<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }

  .row { padding:5px 8px; border-radius:5px; cursor:pointer; display:flex; justify-content:space-between; gap:8px; }
  .row:hover { background:#1a1e27; }

  .row .n { color:#5b6472; font-variant-numeric:tabular-nums; }

  svg { width:100%; height:100%; display:block; }

  #reset { position:absolute; top:8px; right:12px; padding:5px 10px; background:#1a1e27; border:1px solid #2a2f3c; color:#a7b0bd; border-radius:6px; cursor:pointer; }
  .link { fill:none; stroke:#5b6472; }

  .node circle, .node rect, .node polygon { stroke:#0f1115; stroke-width:1.5; }
  .node text { fill:#c2c8d2; font-size:10px; pointer-events:none; }
  .node.dim { opacity:.07; }
  .link.dim { opacity:.04; }
  .elabel.dim { opacity:.04; }
  .elabel { fill:#9aa3b0; font-size:9px; pointer-events:none; }
  .node text.mv { fill:#aeb6c2; font-size:8px; pointer-events:none; }
  .legend { position:absolute; bottom:10px; left:12px; right:12px; font-size:11px; color:#8b93a1; background:rgba(15,17,21,.72); padding:4px 6px; border-radius:6px; }
  .legend span { display:inline-block; margin-right:12px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:2px; vertical-align:middle; margin-right:4px; }
  .swl { display:inline-block; width:14px; height:0; border-top:2px solid; vertical-align:middle; margin-right:4px; }
  #tip { position:absolute; pointer-events:none; background:#181c24; border:1px solid #2a2f3c; padding:6px 8px; border-radius:6px; max-width:300px; font-size:11px; display:none; z-index:5; }
  #tip b { color:#e6eaf0; } #tip .g { color:#8b93a1; }

<script>
const DATA = {"nodes": [{"id": "clue:siblings-are-lemko", "label": "siblings-are-lemko", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md), [Helena Rzepka](../characters/matrona.md), [Tadek Gajda](../characters/secondary-characters.md), and [Janina Gajda](../characters/ciotka.md) are siblings of Lemko descent, hiding behind Polish identities.", "location": ""}, {"id": "clue:three-barred-cross-is-lemko", "label": "three-barred-cross-is-lemko", "kind": "clue", "desc": "The three-barred cross is a Greek Catholic symbol — Lemko, not Roman Catholic. Seeing one on a headstone, icon, or object means the owner was Lemko.", "location": ""}, {"id": "clue:hag-exists", "label": "hag-exists", "kind": "clue", "desc": "Someone lives in the [forest](../locations/hags-cabin.md). Villagers call her a witch, a ghost, a story to scare children. She's real.", "location": ""}, {"id": "clue:hag-is-lemko", "label": "hag-is-lemko", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md) is a Lemko woman living alone in the [forest](../locations/hags-cabin.md). She is ~40, not old — the forest aged her.", "location": ""}, {"id": "clue:officer-is-sb", "label": "officer-is-sb", "kind": "clue", "desc": "[por. Witold Skowron](../characters/officer.md) is an SB (secret police) agent, not just a bureaucrat.", "location": ""}, {"id": "clue:old-village-exists", "label": "old-village-exists", "kind": "clue", "desc": "There's an old, abandoned village in the forest — [%OLD_VILLAGE%](../locations/old-village-ruins.md). Ruins, overgrown paths, stone foundations. People used to live there. Nobody does now.", "location": ""}, {"id": "clue:old-village-was-lemko", "label": "old-village-was-lemko", "kind": "clue", "desc": "[%OLD_VILLAGE%](../locations/old-village-ruins.md) was a Lemko settlement — Greek Catholic, with a cerkiew, orchards, and a tightly-knit community.", "location": ""}, {"id": "clue:lemkos-lived-here", "label": "lemkos-lived-here", "kind": "clue", "desc": "The heights above the valley were Lemko summer pasture. A tumbled koliba (shepherd's hut) on the far ridge shows herders from a Greek Catholic hill community worked these slopes, before the valley was cleared.", "location": ""}, {"id": "clue:abandoned-house-by-streambed", "label": "abandoned-house-by-streambed", "kind": "clue", "desc": "There is an abandoned shepherd's hut (koliba) hidden in the gorse on the far ridge above the streambed, half-swallowed and easy to miss. Long empty.", "location": ""}, {"id": "clue:three-barred-cross-in-abandoned-house", "label": "three-barred-cross-in-abandoned-house", "kind": "clue", "desc": "The timber inside the abandoned koliba on the far ridge is cut all over with three-barred crosses, carved deep and many times over.", "location": ""}, {"id": "clue:massacre-happened", "label": "massacre-happened", "kind": "clue", "desc": "In 1947, the Lemko villagers of [%OLD_VILLAGE%](../locations/old-village-ruins.md) were killed — the whole village, in a single act of violence. They did not \"evacuate.\" They were massacred.", "location": ""}, {"id": "clue:massacre-was-retribution", "label": "massacre-was-retribution", "kind": "clue", "desc": "The killing was not ordered or planned. Soldiers came to deport the villagers; the villagers resisted; the commanding officer was shot dead; and the enraged soldiers massacred the entire village in retribution.", "location": ""}, {"id": "clue:massacre-was-covered-up", "label": "massacre-was-covered-up", "kind": "clue", "desc": "The massacre was never reported. The soldiers covered it up to hide their failure — a dead captain and an unauthorized massacre meant courts-martial. The village was filed as \"evacuated successfully.\"", "location": ""}, {"id": "clue:officer-killed", "label": "officer-killed", "kind": "clue", "desc": "A KBW officer — kpt. Henryk Ćwiek — commanded the unit at [%OLD_VILLAGE%](../locations/old-village-ruins.md). He was shot dead during the operation. Official records list him as KIA in a separate UPA engagement. The truth was buried with him.", "location": ""}, {"id": "clue:dmytro-kosach", "label": "dmytro-kosach", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md)'s lover was named Dmytro Kosach — a UPA guerrilla fighter. He shot kpt. Ćwiek. His bullet turned a deportation into a massacre. He died too — almost certainly in the well with everyone else.", "location": ""}, {"id": "clue:soldier-participated-in-massacre", "label": "soldier-participated-in-massacre", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) was one of the soldiers present during the 1947 massacre. He participated in the killings.", "location": ""}, {"id": "clue:soldier-took-best-land", "label": "soldier-took-best-land", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) settled in %NEW_VILLAGE% early because he knew the terrain from service. He claimed the best plot of land — profiting from the destruction.", "location": ""}, {"id": "clue:old-village-was-burned", "label": "old-village-was-burned", "kind": "clue", "desc": "[%OLD_VILLAGE%](../locations/old-village-ruins.md) was burned after the massacre. Wooden buildings destroyed, but stone survived — the cerkiew, foundations, the well.", "location": ""}, {"id": "clue:massacre-bodies-in-well", "label": "massacre-bodies-in-well", "kind": "clue", "desc": "The remains of the 1947 massacre victims are in [the well](../story-facts/the-well.md). They were never properly buried.", "location": ""}, {"id": "clue:dead-never-mourned", "label": "dead-never-mourned", "kind": "clue", "desc": "The 1947 dead were never given proper rites — no panakhyda, no memorial, no mourning. Twenty years of spiritual debt.", "location": ""}, {"id": "clue:paraskewia-named-the-dead", "label": "paraskewia-named-the-dead", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md) has kept the names of the 1947 dead — twelve Lemko villagers plus [Dmytro Kosach](../characters/secondary-characters.md#dmytro-kosach) — written in Cyrillic in her own hand, and speaks them in her rites. It is the only record they ever existed. See [Paraskewia's List of the Dead](../items/paraskewias-list.md).", "location": ""}, {"id": "clue:dam-covers-evidence", "label": "dam-covers-evidence", "kind": "clue", "desc": "The flood zone was chosen partly to bury the massacre evidence. [por. Witold Skowron](../characters/officer.md) knows this. The dam is infrastructure *and* a burial.", "location": ""}, {"id": "clue:hag-caused-the-massacre", "label": "hag-caused-the-massacre", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md) was in love with Dmytro Kosach, a UPA soldier, in 1947. The authorities traced the connection back to the village. Dmytro killed the commanding officer. The massacre happened because of her love — twice over.", "location": ""}, {"id": "clue:barnas-family-disappeared", "label": "barnas-family-disappeared", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md)'s entire family — him, his partner, and teenage [Hania Barnaś](../characters/jagna.md) — vanished from %NEW_VILLAGE% overnight in 1954. No goodbyes, no forwarding address. Nobody asked questions. Only [Edek Barnaś](../characters/glupek.md) remained.", "location": ""}, {"id": "clue:edeks-father-orphaned-him", "label": "edeks-father-orphaned-him", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) lists herself as mother and [Edward Barnaś](../characters/soldier.md) as the father — left the village. Abandoned his family. The house stayed with her, the boy stayed with her. Consistent with what the rest of the village says.", "location": ""}, {"id": "clue:barnas-had-a-daughter", "label": "barnas-had-a-daughter", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) had a teenage daughter — [Hania Barnaś](../characters/jagna.md). She lived in the house. She's not in the census. She's not in the village. Nobody mentions her unless prompted.", "location": ""}, {"id": "clue:something-happened-in-54", "label": "something-happened-in-54", "kind": "clue", "desc": "Something violent happened one night in 1954. [Zbigniew Gajda](../characters/wojewoda.md) came home drunk and bloody. [Tadek Gajda](../characters/wujas.md) collapsed into the bottle and never came back. The [Barnaś family](../characters/soldier.md) was gone by morning.", "location": ""}, {"id": "clue:matrona-learned-of-affair", "label": "matrona-learned-of-affair", "kind": "clue", "desc": "[Helena Rzepka](../characters/matrona.md) found out about the affair between [Hania Barnaś](../characters/jagna.md) and [Emil Rzepka](../characters/painter.md) on her own, and first tried to handle it quietly — she asked Hania, privately, to give Emil up.", "location": ""}, {"id": "clue:jagna-painter-affair", "label": "jagna-painter-affair", "kind": "clue", "desc": "[Hania Barnaś](../characters/jagna.md) and [Emil Rzepka](../characters/painter.md) were lovers. Open secret in the village — everyone knew.", "location": ""}, {"id": "clue:jagna-knew-the-secret", "label": "jagna-knew-the-secret", "kind": "clue", "desc": "[Hania Barnaś](../characters/jagna.md) had discovered that the Gajda siblings were secretly Lemko — she learned it from [Emil Rzepka](../characters/painter.md). She never used it: no threat, no demand, no word to anyone. She simply knew. It was enough to get her killed — [Helena Rzepka](../characters/matrona.md) presumed the girl would someday use it and did not wait to find out.", "location": ""}, {"id": "clue:matrona-orchestrated-lynch", "label": "matrona-orchestrated-lynch", "kind": "clue", "desc": "[Helena Rzepka](../characters/matrona.md) orchestrated the drinking that led to the lynch. She stayed sober, aimed her brothers at [Hania Barnaś](../characters/jagna.md), and said \"get rid of the problem.\" She never touched anyone — every hand that night was male.", "location": ""}, {"id": "clue:three-drunk-attackers", "label": "three-drunk-attackers", "kind": "clue", "desc": "[Tadek Gajda](../characters/secondary-characters.md), [Zbigniew Gajda](../characters/wojewoda.md), and [Stanisław Rezeń](../characters/butcher.md) were the three drunk men who attacked [Hania Barnaś](../characters/jagna.md).", "location": ""}, {"id": "clue:jagna-was-attacked", "label": "jagna-was-attacked", "kind": "clue", "desc": "[Hania Barnaś](../characters/jagna.md) was beaten by [Tadek Gajda](../characters/secondary-characters.md) and [Stanisław Rezeń](../characters/butcher.md), who tore at her clothes. Her father reached her before it went further.", "location": ""}, {"id": "clue:jagna-fled-the-lynch", "label": "jagna-fled-the-lynch", "kind": "clue", "desc": "[Hania Barnaś](../characters/jagna.md) broke free during the struggle at the well and ran from the village into the night. She was never seen again.", "location": ""}, {"id": "clue:neighbour-believes-jagna-dead", "label": "neighbour-believes-jagna-dead", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) is privately certain [Hania Barnaś](../characters/jagna.md) died the night she fled. Two winters later, hunting, he found human remains in the forest, decided they were hers, and buried them himself. He never confirmed it was her — a coat, some bones, no face. It could have been anyone. No one has ever proven what became of her.", "location": ""}, {"id": "clue:dudka-buried-a-friend-at-the-ravine", "label": "dudka-buried-a-friend-at-the-ravine", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) tends a grave in the meadow above the ravine. He'll say only that it's an old friend who fell from the ravine, and that he buried her himself. He does not name her or explain further.", "location": ""}, {"id": "clue:ravine-remains-a-woman", "label": "ravine-remains-a-woman", "kind": "clue", "desc": "A medical examination of the remains [Ryszard Dudka](../characters/neighbour.md) buried reads the bones as female. Whoever this was, she was a grown woman.", "location": ""}, {"id": "clue:ravine-remains-died-from-fall", "label": "ravine-remains-died-from-fall", "kind": "clue", "desc": "The fracture pattern in the remains points to a single heavy impact — a fall from a height onto hard ground. She was not beaten or stabbed; she fell.", "location": ""}, {"id": "clue:ravine-remains-around-30", "label": "ravine-remains-around-30", "kind": "clue", "desc": "Bone density and joint wear put the woman in the remains at around thirty years old, give or take a couple of years. Not a teenager.", "location": ""}, {"id": "clue:soldier-killed-defending-daughter", "label": "soldier-killed-defending-daughter", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) came to save [Hania Barnaś](../characters/jagna.md) — armed with his old KBW rifle. He held the men back but never fired: they were on him before he could, tackled him, wrenched the rifle away, and beat him to death with it.", "location": ""}, {"id": "clue:wojewoda-was-hurt-that-night", "label": "wojewoda-was-hurt-that-night", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) took a bad injury the night of the 1954 lynch — in the struggle over [Edward Barnaś](../characters/soldier.md)'s rifle, the stock was driven into his ribs and cracked them. They never healed right. He carries the old injury under his clothes and has never explained it.", "location": ""}, {"id": "clue:marta-made-a-deal", "label": "marta-made-a-deal", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md)'s partner, Marta Konieczna, wasn't killed. She bargained — she had nothing to sign away, so she traded the only thing she had: her silence and her disappearance. She agreed to vanish and to tell anyone who asked that the family had moved. She was gone by morning, left the village alive, and never came back.", "location": ""}, {"id": "clue:ciotka-house-is-wojewodas", "label": "ciotka-house-is-wojewodas", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) doesn't own the house she lives in and says so plainly — it's the sołtys's, [Zbigniew Gajda](../characters/wojewoda.md) gave it to her, it's his to allocate. She has no title of her own and names her brother as the source. (On paper the same house was signed over to the [PGR](../locations/pgr-farm.md) — see [departure-declaration-forged](#departure-declaration-forged). Her answer and the record don't agree.)", "location": ""}, {"id": "clue:ciotka-house-is-pgrs", "label": "ciotka-house-is-pgrs", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) says [Janina](../characters/ciotka.md)'s house isn't his to give — it was abandoned, left to the state, and the PGR administers it; he only allocated it to her. His account and Janina's (\"it's the sołtys's\") don't agree.", "location": ""}, {"id": "clue:departure-declaration-forged", "label": "departure-declaration-forged", "kind": "clue", "desc": "The document that recorded the Barnaś family's \"departure\" and handed their house and land to the [PGR](../locations/pgr-farm.md) is a forgery. It carries [Edward Barnaś](../characters/soldier.md)'s signature — but Edward was already dead when it was filed, weeks after the 1954 lynch. Someone forged his hand to make the family's disappearance read as a voluntary move west. The paper is what let the \"they moved away\" story stand.", "location": ""}, {"id": "clue:marta-in-legnica", "label": "marta-in-legnica", "kind": "clue", "desc": "Marta Konieczna resettled west after 1954. She lives in Legnica and works as a nurse. She is reachable by telephone.", "location": ""}, {"id": "clue:marta-has-something-to-hide", "label": "marta-has-something-to-hide", "kind": "clue", "desc": "Marta Konieczna claims the whole family moved west together and split up shortly after — but that collides with the village's story that Edward Barnaś abandoned them and left alone, she guards it too carefully, and she went still with fear when she heard the call was from the valley. She is hiding something about 1954.", "location": ""}, {"id": "clue:marta-witnessed-the-lynch", "label": "marta-witnessed-the-lynch", "kind": "clue", "desc": "Marta Konieczna was present the night of the 1954 lynch and survived it. She saw the men, the well, and Edward Barnaś come to defend his family with his old rifle.", "location": ""}, {"id": "clue:soldier-never-married", "label": "soldier-never-married", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) and his partner never married — they lived together. She kept her own surname. This is why no \"Barnaś\" wife appears in any village records.", "location": ""}, {"id": "clue:glupek-strangled", "label": "glupek-strangled", "kind": "clue", "desc": "The night of the lynch, four-year-old [Edek Barnaś](../characters/glupek.md) wouldn't stop crying, and it annoyed [Stanisław Rezeń](../characters/butcher.md). He took a pillow, pressed it over the boy's face to shut him up, and held it there — deliberate, unhurried. [Janina Gajda](../characters/ciotka.md) tore it away. It left permanent brain damage — not congenital.", "location": ""}, {"id": "clue:lynch-body-in-well", "label": "lynch-body-in-well", "kind": "clue", "desc": "[Edward Barnaś](../characters/soldier.md) — the father — was killed in the 1954 lynch and his body dumped in the old well in [%OLD_VILLAGE%](../locations/old-village-ruins.md), the same well that already held the 1947 massacre remains. His is the *only* body from that night: no one else who was at the well in 1954 is down there.", "location": ""}, {"id": "clue:butcher-has-soldiers-gun", "label": "butcher-has-soldiers-gun", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) took the rifle off [Edward Barnaś](../characters/soldier.md)'s body that night and kept it — the KBW rifle from the night of the lynch. It's still in his house.", "location": ""}, {"id": "clue:butcher-dumped-the-body", "label": "butcher-dumped-the-body", "kind": "clue", "desc": "It was [Stanisław Rezeń](../characters/butcher.md) who put [Edward Barnaś](../characters/soldier.md)'s body down the old well in [%OLD_VILLAGE%](../locations/old-village-ruins.md) the night of the 1954 lynch — he carried the dead man to the well and dropped him in among the 1947 remains.", "location": ""}, {"id": "clue:wujas-loved-jagna", "label": "wujas-loved-jagna", "kind": "clue", "desc": "[Tadek Gajda](../characters/secondary-characters.md) was in love with [Hania Barnaś](../characters/jagna.md), but she chose [Emil Rzepka](../characters/secondary-characters.md).", "location": ""}, {"id": "clue:painter-was-spared", "label": "painter-was-spared", "kind": "clue", "desc": "[Emil Rzepka](../characters/secondary-characters.md) was beaten but spared because he was [Helena Rzepka](../characters/matrona.md)'s fiancé.", "location": ""}, {"id": "clue:painter-heard-matrona", "label": "painter-heard-matrona", "kind": "clue", "desc": "[Emil Rzepka](../characters/secondary-characters.md) heard [Helena Rzepka](../characters/matrona.md)'s voice giving instructions during the lynch.", "location": ""}, {"id": "clue:ciotka-saved-glupek", "label": "ciotka-saved-glupek", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) physically intervened to save [Edek Barnaś](../characters/glupek.md)'s life that night. The family has never forgiven her.", "location": ""}, {"id": "clue:priest-knows-everything", "label": "priest-knows-everything", "kind": "clue", "desc": "[ks. Władysław Pająk](../characters/priest.md) knows the full lynch story — who did what, where the bodies went — because [Janina Gajda](../characters/ciotka.md) confessed it all to him over 13 years.", "location": ""}, {"id": "clue:neighbour-heard-the-lynch", "label": "neighbour-heard-the-lynch", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) heard everything from next door — screaming, shouting, dogs. Possibly saw men dragging bodies toward [%OLD_VILLAGE%](../locations/old-village-ruins.md). Closed the curtain and never spoke.", "location": ""}, {"id": "clue:neighbour-is-rattled", "label": "neighbour-is-rattled", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) drinks too fast and shuts down whenever the past comes up. Something about the old days frightens him.", "location": ""}, {"id": "clue:butcher-stopped-drinking-1954", "label": "butcher-stopped-drinking-1954", "kind": "clue", "desc": "Stanisław Rezeń stopped drinking in 1954 — abruptly, completely. Something happened that year.", "location": ""}, {"id": "clue:butcher-is-dangerous", "label": "butcher-is-dangerous", "kind": "clue", "desc": "Under pressure [Stanisław Rezeń](../characters/butcher.md) doesn't rage — he goes cold. Even breathing, flat eyes, a knife already turning in his hand, three dogs moving around him like his own limbs with no command spoken. He is a controlled, capable killer, and he has plainly stood ready to kill before.", "location": ""}, {"id": "clue:someone-thrown-in-well", "label": "someone-thrown-in-well", "kind": "clue", "desc": "Something — or someone — was recently thrown into the well. Looking down with a light: dark water, shapes below the surface. Can't tell how many or how old. But something fresh went in. **Only exists if the [hag dies](../events/well-confrontation.md#if-nobody-is-there-default--70).**", "location": ""}, {"id": "clue:butcher-visits-the-well", "label": "butcher-visits-the-well", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) visits [%OLD_VILLAGE%](../locations/old-village-ruins.md) regularly. Sits near the well. Clears debris.", "location": ""}, {"id": "clue:butcher-heads-toward-forest", "label": "butcher-heads-toward-forest", "kind": "clue", "desc": "Stanisław Rezeń is often seen heading toward the forest, alone, always in the same direction. He's going somewhere specific.", "location": ""}, {"id": "clue:butcher-compelled-to-feed", "label": "butcher-compelled-to-feed", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) feels compelled to put something IN the well. Strangers = prey. He doesn't fully understand the compulsion.", "location": ""}, {"id": "clue:hag-tends-the-well", "label": "hag-tends-the-well", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md) has spent 20 years performing Lemko rites at the well — fire, incense, bread, honey, prayer. She is containing it through acknowledgement.", "location": ""}, {"id": "clue:butcher-vs-hag", "label": "butcher-vs-hag", "kind": "clue", "desc": "Someone keeps clearing debris from the well. Someone else keeps piling it back and leaving candle wax in the cerkiew. [Stanisław Rezeń](../characters/butcher.md) and [Paraskewia Chyłak](../characters/hag.md) are fighting over the well without knowing each other.", "location": ""}, {"id": "clue:fresh-blood-at-well", "label": "fresh-blood-at-well", "kind": "clue", "desc": "Fresh blood on the well's stone rim. Recent — not old stains. Something was dragged to the well and put in.", "location": ""}, {"id": "clue:someone-killed-at-well", "label": "someone-killed-at-well", "kind": "clue", "desc": "Someone was murdered at the well. Blood smeared on the rim, drag marks from a kneeling position, scattered ritual supplies trampled into mud. The violence was one-directional — the victim didn't fight back. A body was put into the well. **Only exists if the [hag dies](../events/well-confrontation.md#if-nobody-is-there-default--70).**", "location": ""}, {"id": "clue:ciotka-body-taken", "label": "ciotka-body-taken", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md)'s body is gone. Taken from her coffin in [the church](../locations/the-church.md) during the night, while the flood kept her unburied. A wet drag trail leads out toward [%OLD_VILLAGE%](../locations/old-village-ruins.md). **Conditional:** Only exists if [Rezeń takes the body](../events/rezen-takes-the-body.md).", "location": ""}, {"id": "clue:rezen-fed-ciotka-to-well", "label": "rezen-fed-ciotka-to-well", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) took [Janina Gajda](../characters/ciotka.md)'s body from the church and put it in [the well](../story-facts/the-well.md). He doesn't hide it — he frames it as practical: the flood left her unburied, the body was starting to turn, so he dealt with it. He does not understand, or say, that the well pulled him to do it. **Conditional:** Only exists if [Rezeń takes the body](../events/rezen-takes-the-body.md).", "location": ""}, {"id": "clue:players-dream-too", "label": "players-dream-too", "kind": "clue", "desc": "From the first night in the village, the players have dreams of violence — hands doing things, the satisfaction of breaking. Each night worse. By day three they've felt what [Stanisław Rezeń](../characters/butcher.md) has felt for thirteen years.", "location": ""}, {"id": "clue:babcia-mind-returns", "label": "babcia-mind-returns", "kind": "clue", "desc": "[Stefania Kopacz](../characters/babcia.md)'s dementia reverses as the well strengthens. Nobody notices because nobody was watching.", "location": ""}, {"id": "clue:babcia-hears-singing", "label": "babcia-hears-singing", "kind": "clue", "desc": "[Stefania Kopacz](../characters/babcia.md) has heard [Paraskewia Chyłak](../characters/hag.md)'s Lemko prayers carried on the wind at night. She will notice when the singing stops.", "location": ""}, {"id": "clue:ciotka-overdose", "label": "ciotka-overdose", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) died from an overdose of her own sedative pills (Luminal), the nerve-and-sleep medicine she had taken for years. The overdose, not any injury, is what killed her. Whether she took the dose on purpose or miscounted cannot be told from the scene. [Edek Barnaś](../characters/glupek.md) is gone, fled into the forest. **Conditional:** Only exists after players discover the body.", "location": ""}, {"id": "clue:ciotka-hurt-before-death", "label": "ciotka-hurt-before-death", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) was gripped hard by a large, strong hand shortly before she died. A fresh bruise rings her wrist, made while she was still alive. The grip did not kill her, but someone laid hands on her in her last hours.", "location": ""}, {"id": "clue:glupek-fled-into-forest", "label": "glupek-fled-into-forest", "kind": "clue", "desc": "Large bare footprints lead from [Janina Gajda](../characters/ciotka.md)'s house toward the treeline and vanish where the canopy begins. [Edek Barnaś](../characters/glupek.md) fled into the forest the night she died.", "location": ""}, {"id": "clue:junior-smokes-carmen", "label": "junior-smokes-carmen", "kind": "clue", "desc": "[Marek Gajda](../characters/junior.md) smokes Carmen, a premium brand.", "location": ""}, {"id": "clue:butcher-smokes-carmen", "label": "butcher-smokes-carmen", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) smokes Carmen, a premium brand.", "location": ""}, {"id": "clue:edek-has-carmen-cigarette", "label": "edek-has-carmen-cigarette", "kind": "clue", "desc": "An unsmoked Carmen cigarette is hidden in [Edek Barnaś](../characters/glupek.md)'s corner. Edek does not smoke.", "location": ""}, {"id": "clue:rezen-gave-edek-cigarette", "label": "rezen-gave-edek-cigarette", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) gave [Edek Barnaś](../characters/glupek.md) the Carmen cigarette. Rezeń is fond of the boy and slips him food and small gifts.", "location": ""}, {"id": "clue:tadek-smokes-cheapest", "label": "tadek-smokes-cheapest", "kind": "clue", "desc": "[Tadek Gajda](../characters/wujas.md) smokes Sport, the cheapest brand. He does not smoke Carmen.", "location": ""}, {"id": "clue:door-and-well-butts-match", "label": "door-and-well-butts-match", "kind": "clue", "desc": "The Carmen butts from [Janina Gajda](../characters/ciotka.md)'s door and the Carmen butts from [the well](../locations/the-well.md) are the same brand.", "location": ""}, {"id": "clue:priest-smokes", "label": "priest-smokes", "kind": "clue", "desc": "[ks. Władysław Pająk](../characters/priest.md) secretly smokes. He hides the habit.", "location": ""}, {"id": "clue:priest-smokes-carmen", "label": "priest-smokes-carmen", "kind": "clue", "desc": "[ks. Władysław Pająk](../characters/priest.md) secretly smokes Carmen, the same premium brand as Junior and Rezeń. He hides the habit.", "location": ""}, {"id": "clue:glupek-drawn-to-well", "label": "glupek-drawn-to-well", "kind": "clue", "desc": "[Edek Barnaś](../characters/glupek.md) is physically drawn toward [%OLD_VILLAGE%](../locations/old-village-ruins.md) and the well. At the well he becomes still — something in him recognises the place.", "location": ""}, {"id": "clue:covered-mirrors", "label": "covered-mirrors", "kind": "clue", "desc": "[Stefania Kopacz](../characters/babcia.md) covers every mirror in [Barbara Kopacz](../characters/barbara.md)'s house. In [Lemko tradition](../historical%20context/13-lemko-beliefs-and-folk-magic.md), mirrors are covered when someone dies. She's been doing it for twenty years.", "location": ""}, {"id": "clue:barbara-has-help", "label": "barbara-has-help", "kind": "clue", "desc": "Someone is helping [Barbara Kopacz](../characters/barbara.md). The house, the firewood, the economics — a single farm labourer with a child and an elderly mother can't sustain this alone.", "location": ""}, {"id": "clue:barbara-refuses-father", "label": "barbara-refuses-father", "kind": "clue", "desc": "[Barbara Kopacz](../characters/barbara.md) will not name [Pawełek Kopacz](../characters/pawelek.md)'s father under any circumstances. No pressure, authority, or charm moves this. The refusal itself is the clue — she's protecting someone or something.", "location": ""}, {"id": "clue:marek-is-paweleks-father", "label": "marek-is-paweleks-father", "kind": "clue", "desc": "[Barbara Kopacz](../characters/barbara.md) names [Marek Gajda](../characters/junior.md) as [Pawełek Kopacz](../characters/pawelek.md)'s father under pressure. She believes it's true. It's not — the real father is [Tadek Gajda](../characters/wujas.md).", "location": ""}, {"id": "clue:wujas-slept-with-barbara", "label": "wujas-slept-with-barbara", "kind": "clue", "desc": "[Tadek Gajda](../characters/wujas.md) slept with [Barbara Kopacz](../characters/barbara.md) once. Neither of them talks about it. Barbara was also with [Marek Gajda](../characters/junior.md) and assumes Marek is the father. Tadek doesn't even consider the possibility. It was one night.", "location": ""}, {"id": "clue:paweleks-father", "label": "paweleks-father", "kind": "clue", "desc": "[Tadek Gajda](../characters/wujas.md) is [Pawełek Kopacz](../characters/pawelek.md)'s actual father. Nobody knows — not Barbara, not Tadek, not Marek. A one-time encounter nobody thinks about.", "location": ""}, {"id": "clue:pawelek-wanders", "label": "pawelek-wanders", "kind": "clue", "desc": "[Pawełek Kopacz](../characters/pawelek.md) roams the village unsupervised — edges, creek, tree line, further than a 4-year-old should go. Nobody watches him closely enough.", "location": ""}, {"id": "clue:wojewoda-built-barbaras-house", "label": "wojewoda-built-barbaras-house", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) built [Barbara Kopacz](../characters/barbara.md) a house out of guilt — he suspects [Marek Gajda](../characters/junior.md) fathered [Pawełek Kopacz](../characters/secondary-characters.md). He's wrong.", "location": ""}, {"id": "clue:barbara-is-a-sieve", "label": "barbara-is-a-sieve", "kind": "clue", "desc": "[Barbara Kopacz](../characters/barbara.md) shares what she hears from the committee casually with [Ryszard Dudka](../characters/neighbour.md) over the fence. Everything the players tell her reaches the one man sitting on 13 years of guilt.", "location": ""}, {"id": "clue:wife-has-been-investigating", "label": "wife-has-been-investigating", "kind": "clue", "desc": "[Irena Gajda](../characters/wife.md) has spent years quietly investigating the events of 1954. She and [Marek Gajda](../characters/junior.md) work together in secret — a parallel investigation running alongside the committee's.", "location": ""}, {"id": "clue:flour-tin-evidence", "label": "flour-tin-evidence", "kind": "clue", "desc": "[Irena Gajda](../characters/wife.md) keeps her evidence in a flour tin in the pantry — a stained shirt, a mismatched button, newspaper clippings, handwritten notes. Looks like a cover-up dossier. Could be building a case *against* [Zbigniew Gajda](../characters/wojewoda.md) or *for* him — players can't tell.", "location": ""}, {"id": "clue:junior-drinks-with-crew", "label": "junior-drinks-with-crew", "kind": "clue", "desc": "[Marek Gajda](../characters/junior.md) drinks with [Tadek Gajda](../characters/wujas.md)'s crew away from his father — a rebellious kid blowing off the sołtys, not a man on cover-up business.", "location": ""}, {"id": "clue:wujas-is-guilty", "label": "wujas-is-guilty", "kind": "clue", "desc": "Tadek Gajda is guilty of something terrible. He's been drinking to forget for 13 years and the guilt is visibly destroying him.", "location": ""}, {"id": "clue:matrona-controls-painter", "label": "matrona-controls-painter", "kind": "clue", "desc": "[Helena Rzepka](../characters/matrona.md) keeps [Emil Rzepka](../characters/secondary-characters.md) broken, dependent, and terrified. He knows the truth. She's made sure he'll never speak it.", "location": ""}, {"id": "clue:painter-wants-to-confess", "label": "painter-wants-to-confess", "kind": "clue", "desc": "[Emil Rzepka](../characters/secondary-characters.md) secretly wants [Hania Barnaś](../characters/jagna.md) included in the census so she is not erased by the flood.", "location": ""}, {"id": "clue:ciotka-lives-in-soldiers-house", "label": "ciotka-lives-in-soldiers-house", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) lives in [Edward Barnaś](../characters/soldier.md)'s former house — the best plot in the village — raising his brain-damaged son. A single woman in a dead man's house with no clean explanation.", "location": ""}, {"id": "clue:ciotka-moved-in-after-they-were-gone", "label": "ciotka-moved-in-after-they-were-gone", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) wasn't always in that house. A family lived there before — the Barnaś family. They left, and Janina moved in with the boy.", "location": ""}, {"id": "clue:ciotka-adopted-glupek", "label": "ciotka-adopted-glupek", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) took in [Edek Barnaś](../characters/glupek.md) after the family vanished. Nobody asked her to. Nobody stopped her.", "location": ""}, {"id": "clue:ciotka-not-mother", "label": "ciotka-not-mother", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) is not [Edek Barnaś](../characters/glupek.md)'s biological mother. She claimed motherhood on paper, but the village knows better.", "location": ""}, {"id": "clue:ciotka-avoids-family", "label": "ciotka-avoids-family", "kind": "clue", "desc": "[Janina Gajda](../characters/ciotka.md) keeps her distance from the family. She begs off gatherings and stays anxious around her siblings — the avoidance is hers, not theirs.", "location": ""}, {"id": "clue:glupek-fears-butcher", "label": "glupek-fears-butcher", "kind": "clue", "desc": "[Edek Barnaś](../characters/glupek.md) flinches instinctively from [Stanisław Rezeń](../characters/butcher.md). No conscious memory — just a body that knows. When [Stanisław Rezeń](../characters/butcher.md)'s dogs bark, [Edek Barnaś](../characters/glupek.md) hides.", "location": ""}, {"id": "clue:wojewoda-has-only-phone", "label": "wojewoda-has-only-phone", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) has the only telephone in the village, in his office. The village's sole link to the outside world.", "location": ""}, {"id": "clue:wojewoda-has-gun", "label": "wojewoda-has-gun", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) has a pistol in his office. Locked. Symbol of authority — but loaded.", "location": ""}, {"id": "clue:wojewoda-is-lemko", "label": "wojewoda-is-lemko", "kind": "clue", "desc": "A small wooden icon in [Zbigniew Gajda](../characters/wojewoda.md)'s office — Eastern-style devotional art, Greek Catholic. *\"My grandmother's.\"* The sołtys of a Polish village has Lemko blood.", "location": ""}, {"id": "clue:neighbour-has-rifle", "label": "neighbour-has-rifle", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) is a hunter with a licensed hunting rifle.", "location": ""}, {"id": "clue:siblings-fund-the-church", "label": "siblings-fund-the-church", "kind": "clue", "desc": "The siblings keep the [church](../locations/the-church.md) unusually well supplied — firewood, food, gifts. [ks. Władysław Pająk](../characters/priest.md)'s silence is materially supported.", "location": ""}, {"id": "clue:painters-art-shows-the-well", "label": "painters-art-shows-the-well", "kind": "clue", "desc": "[Emil Rzepka](../characters/secondary-characters.md)'s art starts showing the well before the players find it — dark circles, stone rings, black water.", "location": ""}, {"id": "clue:matrona-overperforms", "label": "matrona-overperforms", "kind": "clue", "desc": "Helena Rzepka's public warmth and piety intensifies over time — more church visits, more generosity, more visible devotion. It reads as desperation, a mask starting to slip.", "location": ""}, {"id": "clue:neighbour-avoids-ciotkas-window", "label": "neighbour-avoids-ciotkas-window", "kind": "clue", "desc": "Ryszard Dudka's window facing Ciotka's house is always covered with a heavy curtain — never opened. The window facing Barbara's house has no curtain at all.", "location": ""}, {"id": "clue:neighbour-has-insomnia", "label": "neighbour-has-insomnia", "kind": "clue", "desc": "Ryszard Dudka paces at night and keeps his light on at 3am. He doesn't sleep well.", "location": ""}, {"id": "clue:neighbour-knows-about-edek", "label": "neighbour-knows-about-edek", "kind": "clue", "desc": "Ryszard Dudka knows something about where Edek came from. He deflects when the topic comes up — too quickly, too rehearsed.", "location": ""}, {"id": "clue:church-too-nice", "label": "church-too-nice", "kind": "clue", "desc": "The church is too well-maintained for a village this size — fresh repairs, good supplies, ample firewood. Someone is funding it beyond what the parish can afford.", "location": ""}, {"id": "clue:wujas-misses-someone", "label": "wujas-misses-someone", "kind": "clue", "desc": "When drunk enough, Tadek Gajda's fragments turn to longing. Half-sentences about a woman, a name he won't finish, someone he lost long ago. He misses her badly.", "location": ""}, {"id": "clue:irena-is-watchful", "label": "irena-is-watchful", "kind": "clue", "desc": "Irena Gajda hosts with grace but something is tight behind the hospitality. She listens at doors during conversations with the sołtys — a shadow, a floorboard creak — and tracks the committee more closely than she lets on. She's aware of more than she shows.", "location": ""}, {"id": "clue:wife-protects-husband", "label": "wife-protects-husband", "kind": "clue", "desc": "[Irena Gajda](../characters/wife.md) has realized [Zbigniew Gajda](../characters/wojewoda.md) took part in the 1954 killing. Rather than expose him, she has closed ranks with him. She has stopped investigating, shut the household, and will keep Zbigniew from confessing — even when he wants to.", "location": ""}, {"id": "clue:pgr-workers-hide-something", "label": "pgr-workers-hide-something", "kind": "clue", "desc": "PGR workers exchange glances when asked about accidents. \"The barn's been fixed now.\" Nobody elaborates.", "location": ""}, {"id": "clue:new-village-will-flood", "label": "new-village-will-flood", "kind": "clue", "desc": "%NEW_VILLAGE% will flood. When the reservoir rises, the valley has no outlet below house level. The ridge water-gap, the PGR irrigation ditch, and the old far-ridge streambed all fail to carry the water off, so it backs up onto the houses. This is proof, not speculation.", "location": ""}, {"id": "clue:gap-is-candidate-drain", "label": "gap-is-candidate-drain", "kind": "clue", "desc": "The ridge water-gap is one of the candidate outlets floodwater could leave the %NEW_VILLAGE% valley through.", "location": ""}, {"id": "clue:ditch-is-candidate-drain", "label": "ditch-is-candidate-drain", "kind": "clue", "desc": "The PGR irrigation ditch is one of the candidate outlets floodwater could leave the %NEW_VILLAGE% valley through.", "location": ""}, {"id": "clue:streambed-is-candidate-drain", "label": "streambed-is-candidate-drain", "kind": "clue", "desc": "The old far-ridge streambed is one of the candidate outlets floodwater could leave the %NEW_VILLAGE% valley through.", "location": ""}, {"id": "clue:the-flood-line-potentially-miscalculated", "label": "the-flood-line-potentially-miscalculated", "kind": "clue", "desc": "prof. Bieńkowski suspects the official flood line for the %NEW_VILLAGE% valley may be miscalculated. If the valley does not drain as the survey assumes, the projected safe level is wrong and the new village may not sit above it after all.", "location": ""}, {"id": "clue:gap-is-blocked", "label": "gap-is-blocked", "kind": "clue", "desc": "A ridge separates the low old-village valley from %NEW_VILLAGE%. The state map shows a water-gap through that ridge as an open drain, but an old landslide has plugged it with impermeable fill. Floodwater cannot pass through to the low basin. It is one of the three outlets the valley needs, and it is sealed.", "location": ""}, {"id": "clue:ditch-drains-nothing", "label": "ditch-drains-nothing", "kind": "clue", "desc": "The PGR irrigation ditch cannot carry the floodwater off. At flood volume it backs up and overflows; it is far too small to drain the valley.", "location": ""}, {"id": "clue:ditch-not-built-to-spec", "label": "ditch-not-built-to-spec", "kind": "clue", "desc": "The irrigation ditch matches its concrete-lined specification only for its first short stretch near the fields. Past that it degrades to a shallow, unlined dugout for most of its length. Inspecting only the head gives a false impression of a sound channel.", "location": ""}, {"id": "clue:streambed-dead-ends", "label": "streambed-dead-ends", "kind": "clue", "desc": "The old streambed on the far ridge is not an outlet. Its col sits above house level, so the rising water tops %NEW_VILLAGE% before it ever reaches that streambed.", "location": ""}, {"id": "clue:streambed-parameters", "label": "streambed-parameters", "kind": "clue", "desc": "The two elevations that settle the streambed: the height of the far-ridge col and the height of %NEW_VILLAGE%. The raw figures, before anyone reads what they mean.", "location": ""}, {"id": "clue:dam-builders-surveyed-streambed", "label": "dam-builders-surveyed-streambed", "kind": "clue", "desc": "The Solina dam-survey crews already worked the far-ridge streambed years ago and set geodetic benchmarks (reper) at the col and by the village. The markers are out there in the field, though their recorded elevations never made it into the kit's papers.", "location": ""}, {"id": "clue:streambed-never-drained", "label": "streambed-never-drained", "kind": "clue", "desc": "The old far-ridge streambed has never carried water off, even in the worst floods within living memory. Water pools against the rock there and stops.", "location": ""}, {"id": "clue:landslide-in-the-gap", "label": "landslide-in-the-gap", "kind": "clue", "desc": "A landslide sits in the ridge water-gap, filling the notch with fallen rock and earth.", "location": ""}, {"id": "clue:gap-fill-examined", "label": "gap-fill-examined", "kind": "clue", "desc": "Seen up close from atop the plug, the landslide fill choking the ridge gap is dense clay and shattered rock packed tight, not loose rubble.", "location": ""}, {"id": "clue:river-doesnt-match-map", "label": "river-doesnt-match-map", "kind": "clue", "desc": "The river no longer runs where the map draws it. Its course has shifted: the wojewoda's bridge spans the river's new bed, while the map shows that ground dry and the river running elsewhere. The old course drawn on the map is now dry.", "location": ""}, {"id": "clue:bridge-over-solid-land", "label": "bridge-over-solid-land", "kind": "clue", "desc": "On the state map, a bridge is drawn spanning dry ground while the river is drawn running elsewhere. The map contradicts itself.", "location": ""}, {"id": "clue:map-shows-gap-open", "label": "map-shows-gap-open", "kind": "clue", "desc": "The state map draws the ridge water-gap as an open channel, an outlet for the valley's water.", "location": ""}, {"id": "clue:map-is-outdated", "label": "map-is-outdated", "kind": "clue", "desc": "The state map predates the landslide that plugged the gap. It cannot be trusted on the gap or on the river's course.", "location": ""}, {"id": "clue:survey-was-faked", "label": "survey-was-faked", "kind": "clue", "desc": "The crew sent to re-check the terrain never properly surveyed it. They drove a few stakes, took the wojewoda's ditch on faith, dismissed the changed river, and filed a thin report. The official survey behind the flood projection is worthless.", "location": ""}, {"id": "clue:surveyors-are-known-drunks", "label": "surveyors-are-known-drunks", "kind": "clue", "desc": "The PGR crew rib survey men as famous drunks, and the last survey team who came drank through their whole visit instead of working the ground.", "location": ""}, {"id": "clue:water-tops-the-flood-line", "label": "water-tops-the-flood-line", "kind": "clue", "desc": "During the Day 3 storm, water on the %NEW_VILLAGE% slope climbs about a metre above the surveyors' marked flood line. The projected safe level is already being exceeded.", "location": ""}, {"id": "clue:southern-approach-safe", "label": "southern-approach-safe", "kind": "clue", "desc": "The land south of %NEW_VILLAGE% runs down into a long, mild depression — the obvious place for a rising river to spread. The survey confirms the map: water reaching it stays shallow and drains off, never climbing to the houses. From the south, the village is safe.", "location": ""}, {"id": "clue:old-village-basin-is-the-low-sink", "label": "old-village-basin-is-the-low-sink", "kind": "clue", "desc": "The old-village valley is the lowest ground in the area — the natural basin all the water wants to drain into. It matches the map exactly. Empty ruins now; it will take the water whether or not anyone acts.", "location": ""}, {"id": "clue:new-village-sits-above-flood-line", "label": "new-village-sits-above-flood-line", "kind": "clue", "desc": "By the map's own elevations, %NEW_VILLAGE% sits above the flood line on firm ground. On paper the village is safe — provided the water can drain away through the ridge as the map assumes.", "location": ""}, {"id": "clue:wojewoda-already-suspects-flooding", "label": "wojewoda-already-suspects-flooding", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) already suspects the flood is coming before the committee arrives. He sees it as an opportunity — water swallows the evidence.", "location": ""}, {"id": "clue:road-washes-out", "label": "road-washes-out", "kind": "clue", "desc": "Day 2 brings a major flood. The road out disappears. The committee is stranded. No outside backup.", "location": ""}, {"id": "clue:old-village-flooding", "label": "old-village-flooding", "kind": "clue", "desc": "The old village site is flooding — water rising from below, the well filling. Something underground is changing.", "location": ""}, {"id": "clue:officer-warning", "label": "officer-warning", "kind": "clue", "desc": "[por. Witold Skowron](../characters/officer.md) warns on the drive in: not everything needs to be written down.", "location": ""}, {"id": "clue:phone-is-lifeline", "label": "phone-is-lifeline", "kind": "clue", "desc": "The players can call [Professor](../characters/secondary-characters.md) by phone. If they tell him about the massacre, the truth exists outside the village.", "location": ""}, {"id": "clue:committee-runs-geographical-survey", "label": "committee-runs-geographical-survey", "kind": "clue", "desc": "The committee's stated purpose in the village is a geographical survey — terrain, river, boundaries. It's the cover that explains why outsiders are measuring the land.", "location": ""}, {"id": "clue:committee-notes-property-for-damage", "label": "committee-notes-property-for-damage", "kind": "clue", "desc": "The committee is recording each household's property and its value, ostensibly to assess damages. Asking what land is worth is part of the official remit.", "location": ""}, {"id": "clue:committee-hides-something", "label": "committee-hides-something", "kind": "clue", "desc": "The committee's real business isn't the survey it names. It's here for something it won't state, and the official purpose is a front.", "location": ""}, {"id": "clue:committee-fills-census", "label": "committee-fills-census", "kind": "clue", "desc": "The committee is taking a census: who lives in each household, names, ages, how long they have been here. Counting heads is part of the official remit.", "location": ""}, {"id": "clue:ritual-requires-three-things", "label": "ritual-requires-three-things", "kind": "clue", "desc": "The ritual requires form (how), words (what to say), and truth (naming the dead and what happened).", "location": ""}, {"id": "clue:hag-has-the-form", "label": "hag-has-the-form", "kind": "clue", "desc": "[Paraskewia Chyłak](../characters/hag.md)'s cabin contains icons, candles, herbs, prayer materials — the ritual's form. If alive, she can teach it directly.", "location": ""}, {"id": "clue:babcia-has-the-words", "label": "babcia-has-the-words", "kind": "clue", "desc": "[Stefania Kopacz](../characters/babcia.md) can provide the panakhyda — the Lemko memorial prayers for the dead.", "location": ""}, {"id": "clue:players-supply-truth", "label": "players-supply-truth", "kind": "clue", "desc": "The players must supply the truth by naming the dead and saying what happened to them. The ritual is not a spell — it is acknowledgement.", "location": ""}, {"id": "clue:barbara-must-bring-babcia", "label": "barbara-must-bring-babcia", "kind": "clue", "desc": "[Barbara Kopacz](../characters/barbara.md) is the only one who can physically bring [Stefania Kopacz](../characters/babcia.md) to the well. She needs a human reason — not faith, not ritual. She needs to understand that her mother's people are in that well and Babcia has been mourning them her whole life.", "location": ""}, {"id": "clue:priest-fears-divine-judgment", "label": "priest-fears-divine-judgment", "kind": "clue", "desc": "[ks. Władysław Pająk](../characters/priest.md) believes the flood is literal divine judgment — God drowning a valley that carries an old, unconfessed sin. He fears every soul still in that sin will drown damned.", "location": ""}, {"id": "clue:wolves-attacking-livestock", "label": "wolves-attacking-livestock", "kind": "clue", "desc": "Wolves have been killing [PGR](../locations/pgr-farm.md) livestock for weeks. The 1967 rains are driving them from higher ground. Multiple sheep dead. The attacks started before the committee arrived and are ongoing.", "location": ""}, {"id": "clue:dudka-failed-wolf-hunt", "label": "dudka-failed-wolf-hunt", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) has been hunting the wolves for weeks — he's the village hunter, licensed rifle, knows the forest. He's failed. Can't close on the pack. One man in vast terrain isn't enough.", "location": ""}, {"id": "clue:rezen-hunts-wolves", "label": "rezen-hunts-wolves", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) authorized [Stanisław Rezeń](../characters/butcher.md) to deal with the wolves — sending the request through [Tadek Gajda](../characters/wujas.md). This brought [Rezeń](../characters/butcher.md) out of 13 years of isolation and into the village.", "location": ""}, {"id": "clue:dudka-despises-rezen", "label": "dudka-despises-rezen", "kind": "clue", "desc": "[Ryszard Dudka](../characters/neighbour.md) openly hates [Stanisław Rezeń](../characters/butcher.md). Calls him evil to anyone who listens. The anger is visceral — not just about the wolf authorization. Something older.", "location": ""}, {"id": "clue:rezen-mocks-an-old-failure", "label": "rezen-mocks-an-old-failure", "kind": "clue", "desc": "Taunting [Ryszard Dudka](../characters/neighbour.md), [Stanisław Rezeń](../characters/butcher.md) lets slip *\"you didn't stop me then\"* — implying there was a past occasion when Rezeń did something and Dudka failed to stop him. He never says what or when. Both men clearly remember it.", "location": ""}, {"id": "clue:butcher-knows-forest-intimately", "label": "butcher-knows-forest-intimately", "kind": "clue", "desc": "Stanisław Rezeń knows the forest paths with unnatural intimacy — every trail, every clearing. How does a village outcast know the wilderness this well?", "location": ""}, {"id": "clue:dudka-knows-the-forest", "label": "dudka-knows-the-forest", "kind": "clue", "desc": "Ryszard Dudka has forest knowledge he shouldn't have — and he's furious about Rezeń being authorized to lead the hunt. His anger is personal, not practical.", "location": ""}, {"id": "clue:pgr-underfunded-fences", "label": "pgr-underfunded-fences", "kind": "clue", "desc": "The PGR's fences and livestock infrastructure are underfunded and poorly maintained. Wolves got through because management cut corners.", "location": ""}, {"id": "clue:rezen-leaves-at-night", "label": "rezen-leaves-at-night", "kind": "clue", "desc": "[Stanisław Rezeń](../characters/butcher.md) leaves his house at night and walks toward the forest — toward [%OLD_VILLAGE%](../locations/old-village-ruins.md). Alone. Regularly.", "location": ""}, {"id": "clue:hag-blamed-for-wolves", "label": "hag-blamed-for-wolves", "kind": "clue", "desc": "Villagers blame [Paraskewia Chyłak](../characters/hag.md) for the wolf attacks. They've seen her fires and heard her chanting at [%OLD_VILLAGE%](../locations/old-village-ruins.md). She's performing rites for the dead — appeasing the unquiet — but the village sees witchcraft. Fires in the ruins + wolves that don't touch her = *\"She's summoning them.\"* The connection is the village's projection, not fact.", "location": ""}, {"id": "clue:foreman-coverup", "label": "foreman-coverup", "kind": "clue", "desc": "[Michał Pytlak](../characters/foreman.md) and [Zbigniew Gajda](../characters/wojewoda.md) covered up a preventable death on the PGR farm. Tadeusz Mazur died ~1965 — never reported to the state. His wages still flow to [Wanda Mazur](../characters/widow.md) as a fake \"widow's pension.\" She doesn't know. The village doesn't know the death was never filed. Same mechanism as the lynch: bury the truth, keep outsiders away.", "location": ""}, {"id": "clue:pgr-books-are-sketchy", "label": "pgr-books-are-sketchy", "kind": "clue", "desc": "The crew grumbles that the PGR's books don't add up — pay for people who aren't around, [Michał Pytlak](../characters/foreman.md) and the sołtys keeping the ledgers close. Loose drunk talk, no specifics.", "location": ""}, {"id": "clue:wojewoda-talks-to-sb", "label": "wojewoda-talks-to-sb", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md) meets privately with [the man in the black car](../characters/officer.md) every time he comes — the sołtys reports to the SB. He is the state's ear in the village.", "location": ""}, {"id": "clue:drinking-crew-heads-to-forest", "label": "drinking-crew-heads-to-forest", "kind": "clue", "desc": "Tadek Gajda and his crew regularly head into the treeline with bottles. They're going somewhere in the forest.", "location": ""}, {"id": "clue:old-wartime-positions", "label": "old-wartime-positions", "kind": "clue", "desc": "Traces of old wartime positions in the forest — collapsed dugouts, rusted metal. Someone was here during the war.", "location": ""}, {"id": "clue:bimber-still", "label": "bimber-still", "kind": "clue", "desc": "[Tadek Gajda](../characters/wujas.md)'s crew runs an illegal bimber still in the [forest](../locations/old-village-ruins.md), halfway between the villages. Just moonshine — not the murder conspiracy. [Zbigniew Gajda](../characters/wojewoda.md) knows and tolerates it. [Helena Rzepka](../characters/matrona.md) supplies sugar through the store.", "location": ""}, {"id": "clue:still-is-their-livelihood", "label": "still-is-their-livelihood", "kind": "clue", "desc": "The crew guards the still because it is what carries them through the winter, not because it hides anything worse. Their fear is losing it, nothing more.", "location": ""}, {"id": "clue:crew-may-turn-violent", "label": "crew-may-turn-violent", "kind": "clue", "desc": "Cornered and drunk, the still crew will come to blows if pushed — Franek Mucha throws the first punch.", "location": ""}, {"id": "clue:store-has-drug-cabinet", "label": "store-has-drug-cabinet", "kind": "clue", "desc": "[Helena Rzepka](../characters/matrona.md)'s [store](../locations/the-store.md) has a locked pharmaceutical cabinet — a *szafka apteczna*, standard PRL distribution point. Helena holds the only key. [Halina](../characters/secondary-characters.md) can't open it.", "location": ""}, {"id": "clue:wojewoda-can-call-doctor", "label": "wojewoda-can-call-doctor", "kind": "clue", "desc": "[Zbigniew Gajda](../characters/wojewoda.md)'s office phone can reach [dr. Leon Sawicki](../characters/secondary-characters.md) in the district. Flood-damaged lines — patchy, but it works on the third try.", "location": ""}, {"id": "clue:paweleks-illness", "label": "paweleks-illness", "kind": "clue", "desc": "[Pawełek Kopacz](../characters/pawelek.md) drinks contaminated floodwater near the well and falls ill. Medically ordinary for flood conditions — but his fever dreams mention \"the round stones,\" \"the lady\" who told him not to drink, and water that \"tastes like the ground.\" → [event](../events/pawelek-falls-ill.md)", "location": ""}, {"id": "clue:paweleks-diagnosis", "label": "paweleks-diagnosis", "kind": "clue", "desc": "Bacterial dysentery — *Shigella*, most likely. Fever cycling, bloody stool, dehydration. Fatal without treatment in a child this size. Needs antibacterial medication — but which one and what dosage requires a doctor.", "location": ""}, {"id": "clue:paweleks-contamination", "label": "paweleks-contamination", "kind": "clue", "desc": "The contamination profile is wrong. Concentrated single-source, not diffuse floodwater. High phosphate, high ammonia, anaerobic decay. Something large and organic decomposing in a confined water source for years. Not one body. Many.", "location": ""}, {"id": "clue:well-water-contaminated", "label": "well-water-contaminated", "kind": "clue", "desc": "The well in [%OLD_VILLAGE%](../locations/old-village-ruins.md) is the source of contamination. The water is bad — whoever drinks it gets sick.", "location": ""}, {"id": "clue:old-village-looks-haunted", "label": "old-village-looks-haunted", "kind": "clue", "desc": "[%OLD_VILLAGE%](../locations/old-village-ruins.md) looks haunted — candlelight, incense, footprints — because [Paraskewia Chyłak](../characters/hag.md) is tending it, not because it's empty.", "location": ""}, {"id": "clue:cemetery-missing-graves", "label": "cemetery-missing-graves", "kind": "clue", "desc": "The cemetery at [%OLD_VILLAGE%](../locations/old-village-ruins.md) has fewer graves than it should. Some dead are missing because they are in the well.", "location": ""}, {"id": "clue:upa-bunker", "label": "upa-bunker", "kind": "clue", "desc": "The UPA bunker in the [forest](../locations/old-village-ruins.md) contains old partisan ordnance. Partially collapsed, dangerous. [Michał Pytlak](../characters/secondary-characters.md)'s flood-diversion plan uses explosives from here.", "location": ""}, {"id": "clue:spirits-are-restless", "label": "spirits-are-restless", "kind": "clue", "desc": "The dead here were not buried right. Something is unquiet. Not evidence, not testimony — a feeling grounded in Lemko tradition. The mirrors need covering, the prayers need saying, the dead need tending.", "location": ""}, {"id": "known:foreman: the-flood-line-potentially-miscalculated", "label": "foreman: the-flood-line-potentially-miscalculated", "kind": "known", "npc": "foreman", "desc": "prof. Bieńkowski suspects the official flood line for the %NEW_VILLAGE% valley may be miscalculated. If the valley does not drain as the survey assumes, the projected safe level is wrong and the new village may not sit above it after all.", "location": ""}, {"id": "known:elevations: streambed-parameters", "label": "elevations: streambed-parameters", "kind": "known", "npc": "elevations", "desc": "The two elevations that settle the streambed: the height of the far-ridge col and the height of %NEW_VILLAGE%. The raw figures, before anyone reads what they mean.", "location": ""}], "links": [{"source": "clue:committee-hides-something", "target": "clue:survey-was-faked", "move": "The last survey crew", "mkind": "opportunity", "scat": "location", "skill": "", "skills": "", "location": "bimber-still", "gate": "", "style": "opp", "extra": [], "rel": "soft"}, {"source": "clue:abandoned-house-by-streambed", "target": "clue:lemkos-lived-here", "move": "Read the koliba", "mkind": "opportunity", "scat": "location", "skill": "Culture", "skills": "Culture", "location": "far-ridge-streambed", "gate": "ability: Culture", "style": "opp", "extra": [], "rel": "hard"}, {"source": "clue:abandoned-house-by-streambed", "target": "clue:three-barred-cross-in-abandoned-house", "move": "Duck inside the hut", "mkind": "opportunity", "scat": "location", "skill": "", "skills": "", "location": "far-ridge-streambed", "gate": "", "style": "opp", "extra": [], "re     for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01; const f=K*a.charge*b.charge/d2,d=Math.sqrt(d2);
      const fx=f*dx/d,fy=f*dy/d; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy; } }
  for(const l of links){ const a=l.source,b=l.target;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
    const rest=Math.min(300, 100+(a.deg+b.deg)*6); const f=(d-rest)*0.02,fx=f*dx/d,fy=f*dy/d;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy; }
  for(const n of nodes){ n.vx+=(W/2-n.x)*0.001; n.vy+=(H/2-n.y)*0.001; n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy; }
  // edge labels: anchor near the TARGET end so labels fan out along the spokes
  // instead of piling up at a shared source; repel each other; weak spring back.
  for(const p of labels){ const a=p.link.source,b=p.link.target;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1, off=Math.min(38,d*0.14)*(p.link._bow||1);
    p.ax=a.x+dx*0.6 + (-dy/d)*off; p.ay=a.y+dy*0.6 + (dx/d)*off; }
  for(let i=0;i<labels.length;i++){ const p=labels[i];
    for(let j=i+1;j<labels.length;j++){ const q=labels[j];
      const dx=p.x-q.x, dy=p.y-q.y;
      const ox=(p.hw+q.hw+7)-Math.abs(dx), oy=13-Math.abs(dy);
      if(ox>0 && oy>0){ // bounding boxes overlap -> push apart on the shallower axis
        if(ox<oy){ const s=(dx<0?-1:1)*ox*0.6; p.vx+=s; q.vx-=s; }
        else { const s=(dy<0?-1:1)*oy*0.6; p.vy+=s; q.vy-=s; } } }
  }
  for(const p of labels){
    p.vx+=(p.ax-p.x)*0.04; p.vy+=(p.ay-p.y)*0.04;
    p.vx*=0.8; p.vy*=0.8; p.x+=p.vx; p.y+=p.vy; }
}
function curve(l){
  const a=l.source,b=l.target, dx=b.x-a.x,dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/d, uy=dy/d, px=-uy, py=ux;               // unit dir + perpendicular
  const off=Math.min(38, d*0.14)*(l._bow||1);           // gentle bow, fanned for parallels
  const sx=a.x+ux*10, sy=a.y+uy*10;                     // leave the source node edge
  const ex=b.x-ux*12, ey=b.y-uy*12;                     // stop before the target
  const cx=(sx+ex)/2 + px*off*2, cy=(sy+ey)/2 + py*off*2;
  const t=0.6, mt=1-t;                                  // label point on the arc
  const lx=mt*mt*sx+2*mt*t*cx+t*t*ex, ly=mt*mt*sy+2*mt*t*cy+t*t*ey;
  return {path:`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`, lx, ly};
}
function render(){
  for(const l of links){ const c=curve(l); l._el.setAttribute("d",c.path); l._hit.setAttribute("d",c.path);
    if(l._lb){ const lp=l._lp; l._lb.setAttribute("x",lp.x); l._lb.setAttribute("y",lp.y-2); } }
  for(const n of nodes){ n._el.setAttribute("transform",`translate(${n.x},${n.y})`); }
}
let cool=520;
function loop(){ if(cool>0){ for(let s=0;s<2;s++) tick(); render(); cool--; requestAnimationFrame(loop);} }
loop();

let vt={x:0,y:0,k:1}; function applyVT(){ gRoot.setAttribute("transform",`translate(${vt.x},${vt.y}) scale(${vt.k})`); }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const s=e.deltaY<0?1.1:0.9; vt.x=e.offsetX-(e.offsetX-vt.x)*s; vt.y=e.offsetY-(e.offsetY-vt.y)*s; vt.k*=s; applyVT(); },{passive:false});
let drag=null;
svg.addEventListener("mousedown",e=>{ if(e.target===svg||e.target.tagName==="path") drag={x:e.clientX,y:e.clientY,vx:vt.x,vy:vt.y}; });
window.addEventListener("mousemove",e=>{ if(drag){ vt.x=drag.vx+(e.clientX-drag.x); vt.y=drag.vy+(e.clientY-drag.y); applyVT(); } });
window.addEventListener("mouseup",()=>drag=null);

let active=null;
function focus(id){
  active=id; const {keepN,keepL}=chain(id);
  nodes.forEach(n=>n._el.classList.toggle("dim",!keepN.has(n.id)));
  links.forEach((l,i)=>{ const on=keepL.has(i); l._el.classList.toggle("dim",!on); l._hit.classList.toggle("dim",!on); if(l._lb) l._lb.classList.toggle("dim",!on); });
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",r.dataset.id===id));
  cool=Math.max(cool,50); loop();
}
function showAll(){ active=null; nodes.forEach(n=>n._el.classList.remove("dim"));
  links.forEach(l=>{ l._el.classList.remove("dim"); l._hit.classList.remove("dim"); if(l._lb) l._lb.classList.remove("dim"); });
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("on")); }
document.getElementById("reset").onclick=showAll;

const tip=document.getElementById("tip");
function showNodeTip(n,e){
  let h;
  if(n.kind==="move"){ h=`<b>${n.move||n.label}</b><br><span class="g">${n.mkind} · ${n.scat||"?"} · ${n.label}`+`</span>`;
    if(n.skills) h+=`<br><span class="g">skill: ${n.skills}</span>`;
    if(n.gate) h+=`<br><span class="g">${n.gate}</span>`;
    if(n.extra&&n.extra.length) h+=`<br><span class="g">+ ${n.extra.join(", ")}</span>`; }
  else if(n.kind==="scene"){ h=`<b>${n.label}</b><br><span class="g">${(TYPE[n.catg]||{label:"scene"}).label} · exists · ${n.desc}</span>`; }
  else { h=`<b>${n.label}</b><br><span class="g">`+(n.kind==="known"?"clue known by "+n.npc:"fact")+`</span>`; if(n.desc) h+=`<br>${n.desc}`;
    const gv=incoming.get(n.id).length; h+=`<br><span class="g">${gv} move(s) lead here`+(orphan.has(n.label)?" · ORPHAN":"")+`</span>`; }
  tip.innerHTML=h; tip.style.display="block"; moveTip(e);
}
function showEdgeTip(l,e){
  const gate=l.mkind==="opportunity"?"opportunity":(l.rel==="soft"?"seeded lead":"hard gate");
  let h=`<b>${l.move}</b><br><span class="g">${gate} · ${l.scat||"?"}`+(l.location?` @ ${l.location}`:``)+`</span>`;
  h+=`<br><span class="g">skill: ${l.skills||"none"}</span>`;
  if(l.gate) h+=`<br><span class="g">${l.gate}</span>`;
  h+=`<br><span class="g">${l.source.label} → ${l.target.label}</span>`;
  if(l.extra&&l.extra.length) h+=`<br><span class="g">+ ${l.extra.join(", ")}</span>`;
  tip.innerHTML=h; tip.style.display="block"; moveTip(e);
}
function moveTip(e){ tip.style.left=(e.clientX-320+16)+"px"; tip.style.top=(e.clientY+14)+"px"; }
function hideTip(){ tip.style.display="none"; }

const items=nodes.filter(n=>n.kind==="clue"||n.kind==="known")
  .sort((a,b)=> (a.kind===b.kind? a.label.localeCompare(b.label) : (a.kind==="known"?1:-1)));
const listEl=document.getElementById("list");
function renderList(f){
  listEl.innerHTML="";
  items.filter(c=>!f||c.label.toLowerCase().includes(f)||(c.desc||"").toLowerCase().includes(f))
    .forEach(c=>{ const r=document.createElement("div");
      r.className="row"+(c.kind==="scene"?" scene":"")+(orphan.has(c.label)?" orphan":"")+(active===c.id?" on":"");
      r.dataset.id=c.id;
      const col=(TYPE[typeOf(c)]||TYPE.clue).color;
      r.innerHTML=`<span class="lbl" style="color:${col}">${c.label}</span><span class="n">${incoming.get(c.id).length}</span>`;
      r.onclick=()=>focus(c.id); listEl.appendChild(r); });
}
document.getElementById("search").addEventListener("input",e=>renderList(e.target.value.trim().toLowerCase()));
renderList("");
const c=DATA.counts;
document.getElementById("stats").textContent=`${c.facts} facts · ${c.known} known · ${c.moves} edges`;

// legend
(function(){
  const box=document.getElementById("legend");
  const order=["clue","orphan","known"];
  order.forEach(t=>{
    const sp=document.createElement("span");
    const svgi=document.createElementNS(NSx,"svg"); svgi.setAttribute("width",16); svgi.setAttribute("height",16); svgi.style.verticalAlign="middle"; svgi.style.marginRight="4px";
    const g=document.createElementNS(NSx,"g"); g.setAttribute("transform","translate(8,8)"); g.appendChild(makeShape(t,0.75)); svgi.appendChild(g);
    sp.appendChild(svgi); sp.appendChild(document.createTextNode(TYPE[t].label)); box.appendChild(sp);
  });
  // move helper node label colour = scene type
  Object.entries(SCAT).forEach(([lab,col])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="sw"; i.style.background=col; i.style.borderRadius="6px";
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
  [["#8b93a1","hard gate",false,false],["#8b93a1","seeded lead",true,false],["#8b93a1","opportunity",false,true]]
   .forEach(([col,lab,dash,dot])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="swl"; i.style.borderColor=col;
    if(dash) i.style.borderTopStyle="dashed"; if(dot) i.style.borderTopStyle="dotted";
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
  Object.entries(SKILL).concat([["none",NOSKILL]]).forEach(([lab,col])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="swl"; i.style.borderColor=col; i.style.borderTopWidth="3px";
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
})();

window.addEventListener("resize",()=>{ W=svg.clientWidth; H=svg.clientHeight; });
</script>
