f, but every movable state asset has to be accounted for.", "location": ""}, {"id": "clue:hag-has-the-form", "label": "hag-has-the-form", "kind": "clue", "desc": "[@name](../characters/hag.md)'s cabin contains icons, candles, herbs, prayer materials — the ritual's form. If alive, she can teach it directly.", "location": ""}, {"id": "clue:babcia-has-the-words", "label": "babcia-has-the-words", "kind": "clue", "desc": "[@name](../characters/babcia.md) can provide the panakhyda — the Lemko memorial prayers for the dead.", "location": ""}, {"id": "clue:players-supply-truth", "label": "players-supply-truth", "kind": "clue", "desc": "The players must supply the truth by naming the dead and saying what happened to them. The ritual is not a spell — it is acknowledgement.", "location": ""}, {"id": "clue:priest-fears-divine-judgment", "label": "priest-fears-divine-judgment", "kind": "clue", "desc": "[@name](../characters/priest.md) believes the flood is literal divine judgment — God drowning a valley that carries an old, unconfessed sin. He fears every soul still in that sin will drown damned.", "location": ""}, {"id": "clue:wolves-attacking-livestock", "label": "wolves-attacking-livestock", "kind": "clue", "desc": "Wolves have been killing [@name](../locations/new-village/pgr-farm/pgr-farm.md) livestock for weeks. The 1967 rains are driving them from higher ground. Multiple sheep dead. The attacks started before the committee arrived and are ongoing.", "location": ""}, {"id": "clue:dudka-failed-wolf-hunt", "label": "dudka-failed-wolf-hunt", "kind": "clue", "desc": "[@name](../characters/neighbour.md) has been hunting the wolves for weeks — he's the village hunter, licensed rifle, knows the forest. He's failed. Can't close on the pack. One man in vast terrain isn't enough.", "location": ""}, {"id": "clue:rezen-hunts-wolves", "label": "rezen-hunts-wolves", "kind": "clue", "desc": "[@name](../characters/wojewoda.md) authorized [@name](../characters/butcher.md) to deal with the wolves — sending the request through [@name](../characters/wujas.md). This brought [@name](../characters/butcher.md) out of 13 years of isolation and into the village.", "location": ""}, {"id": "clue:dudka-despises-rezen", "label": "dudka-despises-rezen", "kind": "clue", "desc": "[@name](../characters/neighbour.md) openly hates [@name](../characters/butcher.md). Calls him evil to anyone who listens. The anger is visceral — not just about the wolf authorization. Something older.", "location": ""}, {"id": "clue:rezen-mocks-an-old-failure", "label": "rezen-mocks-an-old-failure", "kind": "clue", "desc": "Taunting [@name](../characters/neighbour.md), [@name](../characters/butcher.md) lets slip *\"you didn't stop me then\"* — implying there was a past occasion when [@surname](../characters/butcher.md) did something and [@surname](../characters/neighbour.md) failed to stop him. He never says what or when. Both men clearly remember it.", "location": ""}, {"id": "clue:pgr-underfunded-fences", "label": "pgr-underfunded-fences", "kind": "clue", "desc": "The PGR's fences and livestock infrastructure are underfunded and poorly maintained. Wolves got through because management cut corners.", "location": ""}, {"id": "clue:rezen-leaves-at-night", "label": "rezen-leaves-at-night", "kind": "clue", "desc": "[@name](../characters/butcher.md) leaves his house at night and walks toward the forest — toward [@name](../locations/old-village-ruins.md). Alone. Regularly.", "location": ""}, {"id": "clue:hag-blamed-for-wolves", "label": "hag-blamed-for-wolves", "kind": "clue", "desc": "Villagers blame [@name](../characters/hag.md) for the wolf attacks. They've seen her fires and heard her chanting at [@name](../locations/old-village-ruins.md). She's performing rites for the dead — appeasing the unquiet — but the village sees witchcraft. Fires in the ruins + wolves that don't touch her = *\"She's summoning them.\"* The connection is the village's projection, not fact.", "location": ""}, {"id": "clue:mazur-paid-but-absent", "label": "mazur-paid-but-absent", "kind": "clue", "desc": "The PGR worker registry pays a full daily wage to [@name](../characters/tadeusz-mazur.md), a labourer no one on the farm answers to or has seen in about two years.", "location": ""}, {"id": "clue:large-grain-purchase", "label": "large-grain-purchase", "kind": "clue", "desc": "The PGR expense journal logs a grain-silo repair in May 1965 and, a week later, the largest single grain purchase in the book. The silo's contents were written off as lost.", "location": ""}, {"id": "clue:grain-has-been-dumped", "label": "grain-has-been-dumped", "kind": "clue", "desc": "A whole silo's worth of grain was dumped rather than used or sold, tipped out and left to rot instead of going to feed or market.", "location": ""}, {"id": "clue:mazur-died-in-the-silo", "label": "mazur-died-in-the-silo", "kind": "clue", "desc": "[@name](../characters/tadeusz-mazur.md) died around 1965 in the farm's concrete grain silo. Tending it meant going up on top of the stored grain, and he fell in alone, sank to the bottom, and was engulfed. Nobody saw it and nothing showed at the surface; his body lay in the grain for about two weeks before the smell gave him away. [@name](../characters/widow.md) believes it was an ordinary farm accident, properly handled.", "location": ""}, {"id": "clue:wanda-receives-pension", "label": "wanda-receives-pension", "kind": "clue", "desc": "[@name](../characters/widow.md) believes she draws a state widow's pension for her late husband, and is grateful to the state for it.", "location": ""}, {"id": "clue:mazur-buried-in-cemetery", "label": "mazur-buried-in-cemetery", "kind": "clue", "desc": "[@name](../characters/tadeusz-mazur.md) lies in a fresh, well-tended grave in the [@name](../locations/new-village/new-village.md) cemetery, the one [@name](../characters/widow.md) kneels beside.", "location": ""}, {"id": "clue:mazur-and-widow-are-old-settlers", "label": "mazur-and-widow-are-old-settlers", "kind": "clue", "desc": "[@first-name](../characters/tadeusz-mazur.md) and [@name](../characters/widow.md) were among the first Polish settlers in [@name](../locations/new-village/new-village.md), arriving around 1948. They were in the village the whole time, through 1954 and after.", "location": ""}, {"id": "clue:mazur-doubted-the-departure", "label": "mazur-doubted-the-departure", "kind": "clue", "desc": "[@name](../characters/widow.md), an original settler who was there at the time, never believed the [@name](../characters/soldier.md) simply moved away. He wrote that they vanished in a single night, leaving standing crops and livestock behind, and was certain the departure was not something they chose.", "location": ""}, {"id": "clue:mazur-wrote-detailed-diary", "label": "mazur-wrote-detailed-diary", "kind": "clue", "desc": "[@name](../characters/widow.md) kept a careful, detailed diary across all his years in the valley — a settler's running record of the village, its people, and its changes.", "location": ""}, {"id": "clue:mazur-death-covered-up", "label": "mazur-death-covered-up", "kind": "clue", "desc": "[@name](../characters/tadeusz-mazur.md) died on the PGR farm and the death was never reported to the state. His wage still flows to [@name](../characters/widow.md), disguised as a \"widow's pension\" she believes is a real state payment. The books prove the death was buried; they do not name who buried it.", "location": ""}, {"id": "clue:foreman-sent-mazur-in-his-place", "label": "foreman-sent-mazur-in-his-place", "kind": "clue", "desc": "[@name](../characters/foreman.md) knew the silo was dangerous and always tended it himself to keep others off it. Tied up with other work, he handed the job to [@name](../characters/tadeusz-mazur.md), his most reliable man. [@surname](../characters/tadeusz-mazur.md) went up alone and fell in. When [@surname](../characters/tadeusz-mazur.md) vanished, [@first-name](../characters/foreman.md) suspected the silo but could not justify dumping a full state store on a guess, and the sołtys refused him permission to empty it. The body only surfaced two weeks later.", "location": ""}, {"id": "clue:foreman-stood-up-to-the-soltys", "label": "foreman-stood-up-to-the-soltys", "kind": "clue", "desc": "[@name](../characters/foreman.md)'s workers respect him for standing up to the boss. They remember him fighting [@name](../characters/wojewoda.md) over the grain.", "location": ""}, {"id": "clue:drinking-crew-heads-to-forest", "label": "drinking-crew-heads-to-forest", "kind": "clue", "desc": "[@name](../characters/wujas.md) and his crew regularly head into the treeline with bottles. They're going somewhere in the forest.", "location": ""}, {"id": "clue:old-wartime-positions", "label": "old-wartime-positions", "kind": "clue", "desc": "Traces of old wartime positions in the forest — collapsed dugouts, rusted metal. Someone was here during the war.", "location": ""}, {"id": "clue:bimber-still", "label": "bimber-still", "kind": "clue", "desc": "[@name](../characters/wujas.md)'s crew runs an illegal bimber still in the [@name](../locations/old-village-ruins.md), halfway between the villages. Just moonshine — not the murder conspiracy. [@name](../characters/wojewoda.md) knows and tolerates it. [@name](../characters/matrona.md) supplies sugar through the store.", "location": ""}, {"id": "clue:still-is-their-livelihood", "label": "still-is-their-livelihood", "kind": "clue", "desc": "The crew guards the still because it is what carries them through the winter, not because it hides anything worse. Their fear is losing it, nothing more.", "location": ""}, {"id": "clue:store-has-drug-cabinet", "label": "store-has-drug-cabinet", "kind": "clue", "desc": "[@name](../characters/matrona.md)'s [@name](../locations/new-village/the-store.md) has a locked pharmaceutical cabinet — a *szafka apteczna*, standard PRL distribution point. [@first-name](../characters/matrona.md) holds the only key. [@name](../characters/secondary/halina-zajac.md) can't open it.", "location": ""}, {"id": "clue:pawelek-burns-with-fever", "label": "pawelek-burns-with-fever", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) is gripped by a sudden high fever, burning hot and shaking with chills.", "location": ""}, {"id": "clue:pawelek-turns-yellow", "label": "pawelek-turns-yellow", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s skin and the whites of his eyes have turned yellow.", "location": ""}, {"id": "clue:pawelek-eyes-are-red", "label": "pawelek-eyes-are-red", "kind": "clue", "desc": "The whites of [@first-name](../characters/pawelek.md)'s eyes have gone bloodshot and crimson.", "location": ""}, {"id": "clue:pawelek-in-muscle-pain", "label": "pawelek-in-muscle-pain", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) cries out when he is moved or touched; his legs and back are in severe pain.", "location": ""}, {"id": "clue:pawelek-passes-dark-urine", "label": "pawelek-passes-dark-urine", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) passes little urine, and what there is runs dark, the colour of strong tea.", "location": ""}, {"id": "clue:pawelek-eyes-not-crying", "label": "pawelek-eyes-not-crying", "kind": "clue", "desc": "The redness sits in the whites of [@first-name](../characters/pawelek.md)'s eyes, not in the lids. It is a sign of the sickness itself, not crying or dust.", "location": ""}, {"id": "clue:pawelek-organs-failing", "label": "pawelek-organs-failing", "kind": "clue", "desc": "The yellowing of [@first-name](../characters/pawelek.md)'s skin is a sign that his organs are failing.", "location": ""}, {"id": "clue:pawelek-not-common-sickness", "label": "pawelek-not-common-sickness", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s illness is not dysentery and not ordinary flu. The fever, muscle pain, red eyes and yellowing together point to something waterborne and specific.", "location": ""}, {"id": "clue:pawelek-got-it-from-water", "label": "pawelek-got-it-from-water", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s sickness came from drinking foul water. It does not pass from person to person. Which water is not clear.", "location": ""}, {"id": "clue:pawelek-drank-water-while-playing", "label": "pawelek-drank-water-while-playing", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) drank water while he was out playing on his own, away from the house.", "location": ""}, {"id": "clue:pawelek-ate-mushrooms-in-the-forest", "label": "pawelek-ate-mushrooms-in-the-forest", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) ate mushrooms while he was out playing on his own in the forest.", "location": ""}, {"id": "clue:pawelek-mushrooms-were-harmless", "label": "pawelek-mushrooms-were-harmless", "kind": "clue", "desc": "The mushrooms [@first-name](../characters/pawelek.md) ate in the forest were ordinary edible ones. [@name](../characters/secondary/staszek-pytlak.md) ate the same ones and stayed well.", "location": ""}, {"id": "clue:pawelek-played-in-pgr", "label": "pawelek-played-in-pgr", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) was out playing on his own in the [@name](../locations/new-village/pgr-farm/pgr-farm.md).", "location": ""}, {"id": "clue:pawelek-looks-like-common-fever", "label": "pawelek-looks-like-common-fever", "kind": "clue", "desc": "Early on, [@first-name](../characters/pawelek.md)'s fever and muscle pain read as an ordinary fever, the kind that goes through a village after a flood. It would be expected to pass on its own.", "location": ""}, {"id": "clue:pawelek-fever-not-passing", "label": "pawelek-fever-not-passing", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s fever has run too long to be an ordinary one. It should have broken by now and has not.", "location": ""}, {"id": "clue:pawelek-has-water-fever", "label": "pawelek-has-water-fever", "kind": "clue", "desc": "The water fever (leptospirosis): a bacterial sickness caught from foul water. [@name](../items/penicillin.md) cures it if it is given in time.", "location": ""}, {"id": "clue:pawelek-has-hepatitis", "label": "pawelek-has-hepatitis", "kind": "clue", "desc": "Infectious hepatitis: a viral sickness of the liver. No antibiotic touches it; the only treatment is rest, and it kills a small child as often as not.", "location": ""}, {"id": "clue:pawelek-needs-penicillin", "label": "pawelek-needs-penicillin", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) needs penicillin, given now at a child's dose, or the water fever kills him.", "location": ""}, {"id": "clue:helena-demands-the-census", "label": "helena-demands-the-census", "kind": "clue", "desc": "[@first-name](../characters/matrona.md) [@surname](../characters/matrona.md) will hand over the penicillin only if the committee lets her fill the village census herself.", "location": ""}, {"id": "clue:pawelek-was-poisoned", "label": "pawelek-was-poisoned", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) was poisoned. The fever, the muscle pain and the yellow skin could all be the marks of a poison rather than an illness.", "location": ""}, {"id": "clue:pawelek-ate-death-cap", "label": "pawelek-ate-death-cap", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s yellowing and failing could be death cap poisoning: a child who ate the wrong mushroom in the woods sickens and yellows just like this.", "location": ""}, {"id": "clue:pawelek-phosphorus-poison", "label": "pawelek-phosphorus-poison", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md)'s signs could be phosphorus poisoning, the yellow rat poison. It would mean someone poisoned him.", "location": ""}, {"id": "clue:pawelek-was-possessed", "label": "pawelek-was-possessed", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) was possessed. His fever dreams of \"the lady\" and \"the round stones,\" and a child sickening while no one else does, look to some like the work of the well rather than a natural illness.", "location": ""}, {"id": "clue:hag-warned-pawelek", "label": "hag-warned-pawelek", "kind": "clue", "desc": "[@name](../characters/hag.md) met [@first-name](../characters/pawelek.md) at the well in person and told him to his face not to drink the water. The \"lady\" in his fever dreams is her.", "location": ""}, {"id": "clue:hag-poisoned-pawelek", "label": "hag-poisoned-pawelek", "kind": "clue", "desc": "The witch in the forest poisoned [@first-name](../characters/pawelek.md). A child who met the \"lady\" at the well and sickened soon after looks, to some, like her doing.", "location": ""}, {"id": "clue:pawelek-needs-a-cleansing-ritual", "label": "pawelek-needs-a-cleansing-ritual", "kind": "clue", "desc": "[@first-name](../characters/pawelek.md) needs a cleansing ritual. To those who read his sickness as the well's work, only the old rites can drive it out of him.", "location": ""}, {"id": "clue:paweleks-diagnosis", "label": "paweleks-diagnosis", "kind": "clue", "desc": "Bacterial dysentery — *Shigella*, most likely. Fever cycling, bloody stool, dehydration. Fatal without treatment in a child this size. Needs antibacterial medication — but which one and what dosage requires a doctor.", "location": ""}, {"id": "clue:paweleks-contamination", "label": "paweleks-contamination", "kind": "clue", "desc": "The contamination profile is wrong. Concentrated single-source, not diffuse floodwater. High phosphate, high ammonia, anaerobic decay. Something large and organic decomposing in a confined water source for years. Not one body. Many.", "location": ""}, {"id": "clue:well-water-contaminated", "label": "well-water-contaminated", "kind": "clue", "desc": "The well in [@name](../locations/old-village-ruins.md) is the source of contamination. The water is bad — whoever drinks it gets sick.", "location": ""}, {"id": "clue:upa-bunkers-in-the-area", "label": "upa-bunkers-in-the-area", "kind": "clue", "desc": "UPA partisans left dugout bunkers (ziemianki) hidden through these forests in the 1940s. More than one is scattered across the hills around the valley.", "location": ""}, {"id": "clue:spirits-are-restless", "label": "spirits-are-restless", "kind": "clue", "desc": "The dead here were not buried right. Something is unquiet. Not evidence, not testimony — a feeling grounded in Lemko tradition. The mirrors need covering, the prayers need saying, the dead need tending.", "location": ""}, {"id": "clue:wrona-hides-search-from-skowron", "label": "wrona-hides-search-from-skowron", "kind": "clue", "desc": "[@name](../characters/driver.md) is looking for something in the van and hiding the search from [@name](../characters/officer.md).", "location": ""}, {"id": "clue:full-bottle-clinking-in-back", "label": "full-bottle-clinking-in-back", "kind": "clue", "desc": "A full bottle is rolling loose in the back of the van.", "location": ""}, {"id": "clue:loose-crate-in-back", "label": "loose-crate-in-back", "kind": "clue", "desc": "A heavy wooden crate in the back of the van has broken its strap and slides on every bend.", "location": ""}, {"id": "clue:wrona-smokes-sport", "label": "wrona-smokes-sport", "kind": "clue", "desc": "[@name](../characters/driver.md) smokes Sport, the cheapest brand.", "location": ""}, {"id": "clue:wrona-took-wrong-turn", "label": "wrona-took-wrong-turn", "kind": "clue", "desc": "[@name](../characters/driver.md) took the wrong fork on the drive in: the left road leads away from the valley.", "location": ""}, {"id": "clue:officer-returns-on-day-4", "label": "officer-returns-on-day-4", "kind": "clue", "desc": "[@name](../characters/officer.md) will come back for the committee's report on the morning of Day 4. Until then, messages go through the sołtys's telephone.", "location": ""}, {"id": "clue:wrona-will-drive-you", "label": "wrona-will-drive-you", "kind": "clue", "desc": "[@name](../characters/driver.md) will drive the committee out of the valley if they ring the Milicja post in Lesko and ask for him.", "location": ""}, {"id": "clue:hook:locations/bimber-still.md", "label": "Bimber Still", "kind": "scene", "catg": "scene", "scat": "location", "desc": "A forest clearing by a stream between Testowo and Hołubie.", "location": ""}, {"id": "clue:hook:locations/far-ridge-streambed/far-ridge-streambed.md", "label": "Far-Ridge Streambed", "kind": "scene", "catg": "scene", "scat": "other", "desc": "A dry streambed on the far ridge, across the valley from Testowo.", "location": ""}, {"id": "clue:hook:locations/far-ridge-streambed/shepherds-hut.md", "label": "The Shepherd's Hut", "kind": "scene", "catg": "scene", "scat": "other", "desc": "An abandoned Lemko shepherd's hut high on the far ridge, above the dry streambed.", "location": ""}, {"id": "clue:hook:locations/upa-bunker.md", "label": "UPA Bunker (Ziemianka)", "kind": "scene", "catg": "scene", "scat": "location", "desc": "A dug-out bunker hidden in the forest northwest of Testowo.", "location": ""}, {"id": "clue:hook:events/surveying-the-streambed.md", "label": "Surveying the Streambed", "kind": "scene", "catg": "scene", "scat": "event", "desc": "Setting up a level line at the far-ridge streambed to measure toward the village.", "location": ""}, {"id": "clue:hook:events/search-for-the-benchmarks.md", "label": "Search for the Benchmarks", "kind": "scene", "catg": "scene", "scat": "event", "desc": "Choosing to comb the overgrown streambed and village edge for old survey markers.", "location": ""}, {"id": "clue:hook:locations/hags-cabin.md", "label": "Hag's Cabin", "kind": "scene", "catg": "scene", "scat": "location", "desc": "A cabin in the deep forest, off an overgrown path from Hołubie.", "location": ""}, {"id": "clue:hook:characters/dmytro-kosach.md", "label": "Dmytro Kosach", "kind": "scene", "catg": "scene", "scat": "character", "desc": "Dmytro Kosach, a UPA fighter from Hołubie, killed in the 1947 massacre.", "location": ""}, {"id": "clue:hook:locations/meadow-by-the-ravine.md", "label": "Meadow by the Ravine", "kind": "scene", "catg": "scene", "scat": "location", "desc": "A meadow by a ravine in the forest between the villages, off an old hunting track.", "location": ""}, {"id": "clue:hook:locations/new-village/barbaras-house.md", "label": "Barbara's House", "kind": "scene", "catg": "scene", "scat": "other", "desc": "The edge of Testowo, beside Ryszard Dudka's house.", "location": ""}, {"id": "clue:hook:characters/hag.md", "label": "Paraskewia Chyłak", "kind": "scene", "catg": "scene", "scat": "character", "desc": "Paraskewia Chyłak, an old Lemko woman who lives alone in the forest.", "location": ""}, {"id": "clue:hook:locations/new-village/butchers-house.md", "label": "Butcher's House", "kind": "scene", "catg": "scene", "scat": "other", "desc": "The edge of Testowo, nearest the forest path toward Hołubie.", "location": ""}, {"id": "clue:hook:locations/new-village/ciotkas-house/attic.md", "label": "Ciotka's House — The Attic", "kind": "scene", "catg": "scene", "scat": "other", "desc": "The hatch in the ceiling of Janina's house, a short ladder folded beside it.", "location": ""}, {"id": "clue:hook:items/barnas-letter.md", "label": "Soldier's Unopened Letter", "kind": "scene", "catg": "scene", "scat": "item", "desc": "A yellowed, still-sealed envelope in a blunt, barrack-trained hand, postmarked 1955.", "location": ""}, {"id": "clue:hook:locations/new-village/ciotkas-house/ciotkas-house.md", "label": "Ciotka's House", "kind": "scene", "catg": "scene", "scat": "other", "desc": "The best plot in Testowo, across from the Neighbour's house.", "location": ""}, {"id": "clue:hook:characters/glupek.md", "label": "Edek Barnaś", "kind": "scene", "catg": "scene", "scat": "character", "desc": "Edek Barnaś, Janina Gajda's large, simple-minded son and dependent.", "location": ""}, {"id": "clue:hook:locations/new-village/matronas-house.md", "label": "Matrona's House", "kind": "scene", "catg": "scene", "s const links = DATA.links.map(l=>({...l, source:nmap.get(l.source), target:nmap.get(l.target)}));

// backward chain: what leads TO a node
const incoming = new Map(); nodes.forEach(n=>incoming.set(n.id,[]));
links.forEach((l,i)=>incoming.get(l.target.id).push(i));

// node degree drives how much space it claims: busy nodes repel harder and push
// their spokes longer, so high-connection clues get room instead of crowding.
nodes.forEach(n=>n.deg=0);
links.forEach(l=>{ l.source.deg++; l.target.deg++; });
nodes.forEach(n=>n.charge=1+Math.sqrt(n.deg)*0.8);

// parallel edges (same source AND target) must fan into separate arcs, else a
// coloured line hides behind a grey one. give each a growing bow radius.
const _par=new Map();
links.forEach(l=>{ const k=l.source.id+">"+l.target.id; const a=_par.get(k)||[]; a.push(l); _par.set(k,a); });
_par.forEach(a=>a.forEach((l,i)=>l._bow=1+i*0.95));
function chain(rootId){
  const keepN=new Set(), keepL=new Set(), stack=[rootId], seen=new Set();
  while(stack.length){
    const id=stack.pop(); if(seen.has(id))continue; seen.add(id); keepN.add(id);
    for(const li of incoming.get(id)){ keepL.add(li); const s=links[li].source.id; keepN.add(s); if(!seen.has(s)) stack.push(s); }
  }
  return {keepN,keepL};
}

const gRoot=document.createElementNS(NS,"g"); svg.appendChild(gRoot);
const gLinks=document.createElementNS(NS,"g"); gRoot.appendChild(gLinks);
const gLbl=document.createElementNS(NS,"g"); gRoot.appendChild(gLbl);
const gNodes=document.createElementNS(NS,"g"); gRoot.appendChild(gNodes);

svg.insertAdjacentHTML("afterbegin",
 '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="context-stroke"/></marker></defs>');

links.forEach(l=>{
  const p=document.createElementNS(NS,"path"); p.setAttribute("class","link "+(l.style||"hard"));
  p.style.stroke=skillColor(l.skill);
  p.setAttribute("marker-end","url(#arr)"); l._el=p; gLinks.appendChild(p);
  const hit=document.createElementNS(NS,"path"); hit.setAttribute("class","hit"); l._hit=hit; gLinks.appendChild(hit);
  hit.addEventListener("mouseenter",e=>showEdgeTip(l,e));
  hit.addEventListener("mousemove",moveTip); hit.addEventListener("mouseleave",hideTip);
  // scene file is a LABEL on the line (coloured by scene type), not a node
  if(l.location){
    const lb=document.createElementNS(NS,"text"); lb.setAttribute("class","elabel");
    lb.setAttribute("text-anchor","middle"); lb.style.fill=SCAT[l.scat]||"#9aa3b0";
    lb.textContent=l.location; l._lb=lb; gLbl.appendChild(lb);
  }
});

// each edge label is a layout particle: it springs to its edge midpoint but
// repels other labels, so labels take up space and stop overlapping.
const labels = links.filter(l=>l._lb).map(l=>{
  const mx=(l.source.x+l.target.x)/2, my=(l.source.y+l.target.y)/2;
  const o={link:l, w:(l.location.length*5), x:mx,y:my,vx:0,vy:0};
  o.hw=o.w/2; l._lp=o; return o;
});

nodes.forEach(n=>{
  const g=document.createElementNS(NS,"g"); g.setAttribute("class","node");
  if(n.kind==="move"){
    // helper node: pill coloured by scene TYPE, edges coloured by skill
    const col=SCAT[n.scat] || "#5b6472";
    const txt=(n.label||"?"); const disp=txt.length>18?txt.slice(0,17)+"…":txt;
    const w=Math.max(20, disp.length*5.2+8);
    const r=document.createElementNS(NS,"rect"); r.setAttribute("x",-w/2); r.setAttribute("y",-8);
    r.setAttribute("width",w); r.setAttribute("height",16); r.setAttribute("rx",8);
    r.style.fill=col+"33"; r.style.stroke=col; r.style.strokeWidth="1.5px"; g.appendChild(r);
    const t=document.createElementNS(NS,"text"); t.setAttribute("class","mv");
    t.style.fill=col;
    t.setAttribute("text-anchor","middle"); t.setAttribute("y",2.5); t.textContent=disp; g.appendChild(t);
  } else {
    const shp=makeShape(typeOf(n), 1); g.appendChild(shp);
    const t=document.createElementNS(NS,"text"); t.setAttribute("x",13); t.setAttribute("y",3);
    t.textContent=n.label.length>28?n.label.slice(0,27)+"…":n.label; g.appendChild(t);
  }
  n._el=g;
  g.addEventListener("mouseenter",e=>showNodeTip(n,e));
  g.addEventListener("mousemove",moveTip); g.addEventListener("mouseleave",hideTip);
  g.addEventListener("click",()=>focus(n.id));
  gNodes.appendChild(g);
});

function tick(){
  const K=9500;
  for(let i=0;i<nodes.length;i++){ const a=nodes[i];
    for(let j=i+1;j<nodes.length;j++){ const b=nodes[j];
      let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy+.01; const f=K*a.charge*b.charge/d2,d=Math.sqrt(d2);
      const fx=f*dx/d,fy=f*dy/d; a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy; } }
  for(const l of links){ const a=l.source,b=l.target;
    let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)+.01;
    const rest=Math.min(300, 100+(a.deg+b.deg)*6); const f=(d-rest)*0.02,fx=f*dx/d,fy=f*dy/d;
    a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy; }
  for(const n of nodes){ n.vx+=(W/2-n.x)*0.001; n.vy+=(H/2-n.y)*0.001; n.vx*=0.85; n.vy*=0.85; n.x+=n.vx; n.y+=n.vy; }
  // edge labels: anchor near the TARGET end so labels fan out along the spokes
  // instead of piling up at a shared source; repel each other; weak spring back.
  for(const p of labels){ const a=p.link.source,b=p.link.target;
    const dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1, off=Math.min(38,d*0.14)*(p.link._bow||1);
    p.ax=a.x+dx*0.6 + (-dy/d)*off; p.ay=a.y+dy*0.6 + (dx/d)*off; }
  for(let i=0;i<labels.length;i++){ const p=labels[i];
    for(let j=i+1;j<labels.length;j++){ const q=labels[j];
      const dx=p.x-q.x, dy=p.y-q.y;
      const ox=(p.hw+q.hw+7)-Math.abs(dx), oy=13-Math.abs(dy);
      if(ox>0 && oy>0){ // bounding boxes overlap -> push apart on the shallower axis
        if(ox<oy){ const s=(dx<0?-1:1)*ox*0.6; p.vx+=s; q.vx-=s; }
        else { const s=(dy<0?-1:1)*oy*0.6; p.vy+=s; q.vy-=s; } } }
  }
  for(const p of labels){
    p.vx+=(p.ax-p.x)*0.04; p.vy+=(p.ay-p.y)*0.04;
    p.vx*=0.8; p.vy*=0.8; p.x+=p.vx; p.y+=p.vy; }
}
function curve(l){
  const a=l.source,b=l.target, dx=b.x-a.x,dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||1;
  const ux=dx/d, uy=dy/d, px=-uy, py=ux;               // unit dir + perpendicular
  const off=Math.min(38, d*0.14)*(l._bow||1);           // gentle bow, fanned for parallels
  const sx=a.x+ux*10, sy=a.y+uy*10;                     // leave the source node edge
  const ex=b.x-ux*12, ey=b.y-uy*12;                     // stop before the target
  const cx=(sx+ex)/2 + px*off*2, cy=(sy+ey)/2 + py*off*2;
  const t=0.6, mt=1-t;                                  // label point on the arc
  const lx=mt*mt*sx+2*mt*t*cx+t*t*ex, ly=mt*mt*sy+2*mt*t*cy+t*t*ey;
  return {path:`M${sx},${sy} Q${cx},${cy} ${ex},${ey}`, lx, ly};
}
function render(){
  for(const l of links){ const c=curve(l); l._el.setAttribute("d",c.path); l._hit.setAttribute("d",c.path);
    if(l._lb){ const lp=l._lp; l._lb.setAttribute("x",lp.x); l._lb.setAttribute("y",lp.y-2); } }
  for(const n of nodes){ n._el.setAttribute("transform",`translate(${n.x},${n.y})`); }
}
let cool=520;
function loop(){ if(cool>0){ for(let s=0;s<2;s++) tick(); render(); cool--; requestAnimationFrame(loop);} }
loop();

let vt={x:0,y:0,k:1}; function applyVT(){ gRoot.setAttribute("transform",`translate(${vt.x},${vt.y}) scale(${vt.k})`); }
svg.addEventListener("wheel",e=>{ e.preventDefault(); const s=e.deltaY<0?1.1:0.9; vt.x=e.offsetX-(e.offsetX-vt.x)*s; vt.y=e.offsetY-(e.offsetY-vt.y)*s; vt.k*=s; applyVT(); },{passive:false});
let drag=null;
svg.addEventListener("mousedown",e=>{ if(e.target===svg||e.target.tagName==="path") drag={x:e.clientX,y:e.clientY,vx:vt.x,vy:vt.y}; });
window.addEventListener("mousemove",e=>{ if(drag){ vt.x=drag.vx+(e.clientX-drag.x); vt.y=drag.vy+(e.clientY-drag.y); applyVT(); } });
window.addEventListener("mouseup",()=>drag=null);

let active=null;
function focus(id){
  active=id; const {keepN,keepL}=chain(id);
  nodes.forEach(n=>n._el.classList.toggle("dim",!keepN.has(n.id)));
  links.forEach((l,i)=>{ const on=keepL.has(i); l._el.classList.toggle("dim",!on); l._hit.classList.toggle("dim",!on); if(l._lb) l._lb.classList.toggle("dim",!on); });
  document.querySelectorAll(".row").forEach(r=>r.classList.toggle("on",r.dataset.id===id));
  cool=Math.max(cool,50); loop();
}
function showAll(){ active=null; nodes.forEach(n=>n._el.classList.remove("dim"));
  links.forEach(l=>{ l._el.classList.remove("dim"); l._hit.classList.remove("dim"); if(l._lb) l._lb.classList.remove("dim"); });
  document.querySelectorAll(".row").forEach(r=>r.classList.remove("on")); }
document.getElementById("reset").onclick=showAll;
// centre the viewport on a node (pan, keep a readable zoom)
function panTo(id){ const n=nodes.find(x=>x.id===id); if(!n) return;
  const k=Math.max(vt.k,1.2); vt.k=k; vt.x=W/2-n.x*k; vt.y=H/2-n.y*k; applyVT(); }

const tip=document.getElementById("tip");
function showNodeTip(n,e){
  let h;
  if(n.kind==="move"){ h=`<b>${n.move||n.label}</b><br><span class="g">${n.mkind} · ${n.scat||"?"} · ${n.label}`+`</span>`;
    if(n.skills) h+=`<br><span class="g">skill: ${n.skills}</span>`;
    if(n.gate) h+=`<br><span class="g">${n.gate}</span>`;
    if(n.extra&&n.extra.length) h+=`<br><span class="g">+ ${n.extra.join(", ")}</span>`; }
  else if(n.kind==="scene"){ h=`<b>${n.label}</b><br><span class="g">${(TYPE[n.catg]||{label:"scene"}).label} · exists · ${n.desc}</span>`; }
  else { h=`<b>${n.label}</b><br><span class="g">`+(n.kind==="known"?"clue known by "+n.npc:"fact")+`</span>`; if(n.desc) h+=`<br>${n.desc}`;
    const gv=incoming.get(n.id).length; h+=`<br><span class="g">${gv} move(s) lead here`+(orphan.has(n.label)?" · ORPHAN":"")+`</span>`; }
  tip.innerHTML=h; tip.style.display="block"; moveTip(e);
}
function showEdgeTip(l,e){
  const gate=l.mkind==="synthesis"?"synthesis":(l.mkind==="opportunity"?"opportunity":(l.rel==="soft"?"seeded lead":"hard gate"));
  let h=`<b>${l.move}</b><br><span class="g">${gate} · ${l.scat||"?"}`+(l.location?` @ ${l.location}`:``)+`</span>`;
  h+=`<br><span class="g">skill: ${l.skills||"none"}</span>`;
  if(l.gate) h+=`<br><span class="g">${l.gate}</span>`;
  h+=`<br><span class="g">${l.source.label} → ${l.target.label}</span>`;
  if(l.extra&&l.extra.length) h+=`<br><span class="g">+ ${l.extra.join(", ")}</span>`;
  tip.innerHTML=h; tip.style.display="block"; moveTip(e);
}
function moveTip(e){ tip.style.left=(e.clientX-320+16)+"px"; tip.style.top=(e.clientY+14)+"px"; }
function hideTip(){ tip.style.display="none"; }

const items=nodes.filter(n=>n.kind==="clue"||n.kind==="known"||n.kind==="scene")
  .sort((a,b)=> (a.kind===b.kind? a.label.localeCompare(b.label) : (a.kind==="known"?1:-1)));
const listEl=document.getElementById("list");
function renderList(f){
  listEl.innerHTML="";
  items.filter(c=>!f||c.label.toLowerCase().includes(f)||(c.desc||"").toLowerCase().includes(f))
    .forEach(c=>{ const r=document.createElement("div");
      r.className="row"+(c.kind==="scene"?" scene":"")+(orphan.has(c.label)?" orphan":"")+(active===c.id?" on":"");
      r.dataset.id=c.id;
      const col=(TYPE[typeOf(c)]||TYPE.clue).color;
      r.innerHTML=`<span class="lbl" style="color:${col}">${c.label}</span><span class="n">${incoming.get(c.id).length}</span>`;
      r.onclick=()=>{ active=c.id; document.querySelectorAll(".row").forEach(x=>x.classList.toggle("on",x.dataset.id===c.id)); panTo(c.id); }; listEl.appendChild(r); });
}
renderList("");
const c=DATA.counts;
document.getElementById("stats").textContent=`${c.facts} facts · ${c.known} known · ${c.moves} edges`;

// legend
(function(){
  const box=document.getElementById("legend");
  const order=["clue","orphan","known","scene"];
  order.forEach(t=>{
    const sp=document.createElement("span");
    const svgi=document.createElementNS(NSx,"svg"); svgi.setAttribute("width",16); svgi.setAttribute("height",16); svgi.style.verticalAlign="middle"; svgi.style.marginRight="4px";
    const g=document.createElementNS(NSx,"g"); g.setAttribute("transform","translate(8,8)"); g.appendChild(makeShape(t,0.75)); svgi.appendChild(g);
    sp.appendChild(svgi); sp.appendChild(document.createTextNode(TYPE[t].label)); box.appendChild(sp);
  });
  // move helper node label colour = scene type
  Object.entries(SCAT).forEach(([lab,col])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="sw"; i.style.background=col; i.style.borderRadius="6px";
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
  [["#8b93a1","hard gate","solid"],["#8b93a1","seeded lead","dashed"],["#8b93a1","opportunity","dotted"],["#8b93a1","synthesis","double"]]
   .forEach(([col,lab,style])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="swl"; i.style.borderColor=col;
    i.style.borderTopStyle=style;
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
  Object.entries(SKILL).concat([["none",NOSKILL]]).forEach(([lab,col])=>{
    const sp=document.createElement("span");
    const i=document.createElement("i"); i.className="swl"; i.style.borderColor=col; i.style.borderTopWidth="3px";
    sp.appendChild(i); sp.appendChild(document.createTextNode(lab)); box.appendChild(sp);
  });
})();

window.addEventListener("resize",()=>{ W=svg.clientWidth; H=svg.clientHeight; });
</script>
</body>
